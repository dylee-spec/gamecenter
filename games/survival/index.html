<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벰파이어 서바이벌 베낀게임</title>
<style>
:root{color-scheme:dark;--bg:#0a0908;--panel-1:#241f19;--panel-2:#16130f;--ink:#f1e7cc;--dim:#b8ac8d;--gold:#d9b26a;--gold-bright:#ffdd9a;--red:#8a2c3a;--red-bright:#c0495a;--line:#54492f;--edge:#000}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse 900px 560px at 50% -8%,#241d14 0%,transparent 62%),radial-gradient(ellipse 900px 620px at 50% 118%,#1c0d0f 0%,transparent 58%),var(--bg);color:var(--ink);font:15px/1.6 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;overflow:hidden}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.03;mix-blend-mode:overlay;background-image:repeating-linear-gradient(0deg,#fff,#fff 1px,transparent 1px,transparent 3px),repeating-linear-gradient(90deg,#fff,#fff 1px,transparent 1px,transparent 3px)}
button,input,select{font:inherit}
button{cursor:pointer;background:linear-gradient(180deg,#332c22,#1a1712);border:1px solid #6c6046;border-radius:3px;color:var(--ink);padding:11px 20px;letter-spacing:.01em;box-shadow:inset 0 1px 0 #ffffff14,inset 0 -2px 0 #0000003d,0 2px 6px #0006;transition:transform .12s ease,box-shadow .12s ease,background .12s ease,border-color .12s ease}
button:hover{background:linear-gradient(180deg,#463f2c,#211c15);border-color:var(--gold);transform:translateY(-1px);box-shadow:inset 0 1px 0 #ffffff1f,inset 0 -2px 0 #0000004d,0 5px 14px #0008,0 0 16px -5px #d9b26a70}
button:active{transform:translateY(0)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ffe29b;outline-offset:3px;border-radius:2px}
button:disabled{opacity:.42;cursor:default;transform:none;box-shadow:none}
button.primary{background:linear-gradient(180deg,#a04552,#6f2530);border-color:#e29882;min-height:52px;font-weight:700;letter-spacing:.1em;box-shadow:inset 0 1px 0 #ffffff26,inset 0 -3px 0 #00000050,0 6px 18px -4px #7d233199}
button.primary:hover{background:linear-gradient(180deg,#bd4d5c,#84293a);box-shadow:inset 0 1px 0 #ffffff30,inset 0 -3px 0 #00000050,0 10px 26px -6px #b8394a99,0 0 22px -6px #ffb3b366}
button.selected{border-color:var(--gold-bright);background:linear-gradient(180deg,#4a4029,#241f16);box-shadow:inset 0 0 0 2px #aa894b,0 0 18px -5px #d9b26a99}
input,select{color:var(--ink);background:#111310;border:1px solid #615641;border-radius:3px;padding:10px;width:100%}
input:hover,select:hover{border-color:#8b7954}
input[type=checkbox]{width:auto;accent-color:#c69754}
h1,h2,h3,p{margin:0}
h1,h2{font-family:Georgia,Batang,'Songti SC',serif}
h1{font-size:clamp(27px,4.5vw,54px);line-height:1.25;letter-spacing:-.04em;color:#f2dda3;text-shadow:0 2px 0 #000,0 6px 22px #000a,0 0 34px #d9b26a3d}
h2{font-size:30px;color:#ecd39d;text-shadow:0 2px 0 #0006}
h3{font-size:16px;color:#e6cd93}
a{color:#e8ca87}
a:hover{color:var(--gold-bright)}
.muted{color:var(--dim)}
.small{font-size:12px}
.gold{color:#f0d693}
.red{color:#f2a19f}
.hidden{display:none!important}
#world{position:fixed;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#0d1310;touch-action:none}
#vignette{pointer-events:none;position:fixed;inset:0;box-shadow:inset 0 0 90px #000c,inset 0 0 220px #000a}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,#0a0b0bc4,#050606a3 75%);backdrop-filter:blur(4px) saturate(1.05);overflow:auto}
#screen.off{display:none}
.panel{position:relative;width:min(1120px,100%);max-height:calc(100dvh - 48px);overflow:auto;background:radial-gradient(ellipse at 20% -10%,#2c261c,#171410 65%);border:1px solid #8b7954;outline:4px solid var(--edge);box-shadow:0 0 0 1px #000,0 25px 90px -12px #000d,inset 0 0 70px -30px #000;padding:30px}
.panel::before{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:140px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.panel::-webkit-scrollbar,.scroll-table::-webkit-scrollbar{width:10px}
.panel::-webkit-scrollbar-thumb,.scroll-table::-webkit-scrollbar-thumb{background:#54492f;border-radius:5px}
.panel::-webkit-scrollbar-track,.scroll-table::-webkit-scrollbar-track{background:#141210}
.panel{scrollbar-color:#54492f #141210}
.panel.narrow{max-width:790px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
.eyebrow{font-size:12px;color:#d0b781;letter-spacing:.2em;margin-bottom:10px;text-transform:uppercase}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px 0;position:relative}
.divider::after{content:'◆';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--gold);background:#1a1712;padding:0 10px;font-size:9px}
.home-layout{display:grid;grid-template-columns:1.25fr 1fr;gap:38px}
.menu-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
.menu-actions .primary{grid-column:1/-1}
.crest{width:100%;height:180px;image-rendering:pixelated;border:1px solid #4a4130;border-bottom:2px solid var(--gold);margin-bottom:16px;box-shadow:0 8px 22px -10px #000c}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:grid;gap:12px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}
.choice{position:relative;text-align:left;padding:20px;min-height:230px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,#231e17,#161310);border:1px solid #3c3626;border-radius:4px;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.choice::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.choice:hover,.choice:focus-visible{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 14px 30px -10px #000d,0 0 0 1px #d9b26a55}
.choice h3{font-size:20px}
.choice .description{flex:1;font-size:14px;line-height:1.8}
.badge{font-size:11px;color:#dcc794;letter-spacing:.03em}
.icon{width:40px;height:40px;image-rendering:pixelated;vertical-align:middle;flex-shrink:0;filter:drop-shadow(0 2px 3px #0008)}
.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.character{position:relative;flex-direction:column;text-align:center;display:flex;align-items:stretch;gap:0;padding:0;min-width:0;overflow:hidden}
.character .char-name{background:linear-gradient(180deg,#39311f,#221c13);border-bottom:1px solid #544c36;padding:7px 4px;font-size:12px;font-weight:700;color:#e9d29a;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.character .char-portrait{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0;background:radial-gradient(ellipse at 50% 28%,#2e2818,transparent 72%)}
.character canvas{width:56px;height:auto;image-rendering:pixelated;filter:drop-shadow(0 3px 4px #0009)}
.character .char-weapon{padding:6px 4px 8px;font-size:10px;color:#a89f86;border-top:1px solid #2b2717}
.character::before,.character::after{content:'';position:absolute;top:5px;width:6px;height:6px;background:transparent;transform:rotate(45deg);transition:background .15s ease,box-shadow .15s ease}
.character::before{left:5px}
.character::after{right:5px}
.character.selected::before,.character.selected::after{background:var(--gold-bright);box-shadow:0 0 6px #ffdd9aa0}
.selection-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:22px}
.detail{background:linear-gradient(160deg,#171410cc,#11100caa);border:1px solid #453f2e;border-radius:3px;padding:18px}
.char-head{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.char-head-portrait{width:54px;height:auto;image-rendering:pixelated;filter:drop-shadow(0 3px 5px #0009);flex-shrink:0}
.stat-list{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px;min-height:76px}
.stat-list li{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.6}
.stat-list .stat-dot{flex-shrink:0;width:7px;height:7px;margin-top:6px;background:var(--gold);box-shadow:0 0 5px #d9b26a80;transform:rotate(45deg)}
.map-list{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.map-button{padding:0;text-align:left;overflow:hidden;border-radius:3px}
.map-button canvas{display:block;width:100%;height:66px;image-rendering:pixelated}
.map-button span{display:block;padding:8px;font-size:12px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.rank-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:11px 4px;border-bottom:1px solid #38372e;align-items:center;border-radius:2px}
.rank-row:hover{background:#ffffff06}
.rank-row .place{color:var(--gold);font-size:19px;font-family:Georgia,serif}
.rank-row:nth-child(1) .place{color:#ffe6ac;text-shadow:0 0 10px #ffd98a90}
.rank-row:nth-child(2) .place{color:#dfe2e7}
.rank-row:nth-child(3) .place{color:#dda06a}
.rank-row small{color:#a7a491;display:block;font-size:11px}
.rank-row strong{font-size:16px}
.rank-empty{padding:22px 0;color:#a9a28c}
.scroll-table{max-height:50dvh;overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{text-align:left;padding:10px}
td{border-bottom:1px solid #332f24}
th{position:sticky;top:0;background:#282319;color:#f0d999;font-weight:700;letter-spacing:.02em;border-bottom:2px solid #6c6046}
tr:nth-child(even) td{background:#1a1713}
.codex-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{padding:14px;background:linear-gradient(160deg,#181510,#121009);border:1px solid #453f2e;border-radius:3px}
.stat b{display:block;font-size:24px;color:#eecb8f;text-shadow:0 2px 0 #0006}
.stat span{font-size:12px;color:#aaa38d}
.equip-list{display:flex;flex-wrap:wrap;gap:6px}
.equip{padding:7px 8px;background:linear-gradient(160deg,#1d1a12,#121009);border:1px solid #544c36;border-radius:3px;box-shadow:inset 0 1px 0 #ffffff0d,0 2px 6px #0006;display:flex;align-items:center;gap:6px;font-size:12px}
.equip .icon{width:24px;height:24px}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
.hud-top{position:absolute;top:0;left:0;right:0;background:linear-gradient(#101212f2,#101212c0 75%,transparent);border-bottom:1px solid #00000000;box-shadow:0 1px 0 #8b795455;padding:13px 22px 9px}
.hud-main{display:flex;justify-content:space-between;align-items:center;gap:15px}
.hud-main .clock{font:700 28px/1.1 Consolas,monospace;color:#ffedc0;text-shadow:2px 2px 0 #000,0 0 16px #d9b26a55;letter-spacing:.02em}
.hud-controls{pointer-events:auto;display:flex;gap:6px}
.hud-controls button{padding:5px 10px;font-size:12px}
.xp-track{height:7px;background:#12151a;margin-top:8px;border-radius:2px;overflow:hidden;box-shadow:inset 0 1px 3px #0008}
.xp-track i{display:block;background:linear-gradient(90deg,#4f9fd4,#7fd0f5);height:100%;width:0;box-shadow:0 0 12px #5bbaebaa;transition:width .2s ease}
.hud-bottom{position:absolute;left:20px;bottom:18px;display:flex;gap:12px;align-items:end}
.hud-bottom .equip-list{max-width:490px}
.hud-help{position:absolute;bottom:18px;right:20px;font-size:12px;text-align:right;color:#c3c4ae;text-shadow:0 1px 3px #000}
#notice{position:fixed;top:125px;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;color:#ffdfa0;text-shadow:2px 2px 0 #000;font-size:21px;opacity:0;transition:opacity .2s;background:linear-gradient(180deg,#141812f0,#101410d0);padding:9px 24px;border:1px solid #ba8d4855;border-radius:2px}
#touch{position:fixed;bottom:40px;left:40px;width:112px;height:112px;border:2px solid #d9b26a80;border-radius:50%;display:none;pointer-events:none;background:#1115;box-shadow:0 0 0 1px #0008}
#touch i{position:absolute;left:36px;top:36px;width:36px;height:36px;border-radius:50%;background:#ddd7}
.note{background:linear-gradient(160deg,#181510,#121009);padding:13px 15px;border-left:3px solid var(--gold);font-size:13px;line-height:1.9;border-radius:0 2px 2px 0}
.book-copy{line-height:1.9;font-size:14px}
.book-copy p{margin-bottom:14px}
.book-copy ul{padding-left:22px}
.upgrade-shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.upgrade-shop button{text-align:left}
.weapon-report{display:grid;grid-template-columns:1fr 90px 90px;gap:10px;border-bottom:1px solid #37372c;padding:8px 0;font-size:13px}
.result-title{text-align:center;padding:18px}
.result-title h2{font-size:40px}
.result-title p{color:#b4ac95}
.helpkeys{border:1px solid #665c42;padding:2px 6px;background:#171713;border-radius:2px}
details{margin:12px 0}
summary{cursor:pointer;color:#dbc18a}
summary:hover{color:var(--gold-bright)}
#save-warning{color:#f7b590;margin-top:10px}
.footer-note{font-size:11px;color:#898879;margin-top:18px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important;animation-iteration-count:1!important}}
@media(max-width:760px){#screen{padding:12px}.panel{padding:18px;max-height:calc(100dvh - 24px)}.home-layout,.selection-layout{grid-template-columns:1fr;gap:20px}.home-layout .home-side{display:none}.roster{grid-template-columns:repeat(3,1fr)}.map-list{grid-template-columns:repeat(3,1fr)}.choices{grid-template-columns:1fr;gap:8px}.choice{min-height:0;padding:13px;gap:6px}.choice .description{font-size:13px}.choice h3{font-size:17px}.choice .icon{width:28px;height:28px}.upgrade-shop{grid-template-columns:repeat(2,1fr)}.hud-top{padding:7px 10px}.hud-main{gap:7px;font-size:11px}.hud-main .clock{font-size:22px}.hud-controls button{padding:4px 7px}.hud-bottom{left:10px;bottom:10px}.hud-bottom .equip{padding:3px}.hud-bottom .equip span{display:none}.hud-help{display:none}.stat-grid{grid-template-columns:repeat(3,1fr)}.stat{padding:9px}.stat b{font-size:19px}h2{font-size:25px}.character .char-name{padding:5px 3px;font-size:10px}.character .char-weapon{padding:4px 3px 6px;font-size:9px}.character canvas{width:40px}}
</style>
</head>
<body>
<canvas id="world" aria-label="생존 게임 전장"></canvas><div id="vignette"></div>
<div id="hud"><div class="hud-top"><div class="hud-main"><div><b id="hud-level">레벨 1</b><div id="hud-map" class="small muted"></div></div><div style="text-align:center"><div id="hud-time" class="clock">00:00</div><small id="hud-wave" class="muted">박쥐의 밤</small></div><div><b id="hud-kills">처치 0</b><div id="hud-gold" class="gold small">금화 0</div></div><div class="hud-controls"><button id="pause-button">일시정지</button><button id="sound-button">소리 켜짐</button></div></div><div class="xp-track"><i id="xp-fill"></i></div></div><div class="hud-bottom"><div><div id="hud-health" class="small"></div><div id="hud-equipment" class="equip-list"></div></div></div><div class="hud-help">방향키로 이동 · 공격은 자동<br>공백 키로 일시정지 · 마우스 드래그로도 이동</div></div>
<div id="notice" role="status" aria-live="polite"></div><div id="touch"><i></i></div><main id="screen"></main>
<script>
'use strict';
// Original Canvas sprites and synthesised audio; no remote assets or dependencies.
const $=id=>document.getElementById(id),TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),fmt=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const canvas=$('world'),ctx=canvas.getContext('2d',{alpha:false});canvas.width=960;canvas.height=540;ctx.imageSmoothingEnabled=false;
const W={};
function weapon(id,name,type,color,damage,cool,desc,max=8){W[id]={id,name,type,color,damage,cool,desc,max};}
weapon('whip','채찍','whip','#f0c991',10,1.35,'바라보는 쪽을 수평으로 베어 적을 관통합니다.');
weapon('wand','마법 지팡이','wand','#8bcbff',10,1.15,'가장 가까운 적을 자동으로 조준합니다.');
weapon('knife','단검','knife','#dbe3e3',6.5,.85,'마지막 이동 방향으로 빠르게 날아갑니다.');
weapon('axe','도끼','axe','#96b9bd',20,3.1,'위로 던진 도끼가 포물선을 그리며 떨어집니다.');
weapon('cross','십자가','cross','#e9d99a',5,2.5,'가까운 적을 향해 날아갔다 되돌아옵니다.');
weapon('bible','왕의 성서','bible','#a987d4',10,4,'주위를 공전하는 성서가 적을 밀어냅니다.');
weapon('fire','불의 지팡이','fire','#ff9056',20,3,'무작위 적에게 강력한 화염탄을 발사합니다.');
weapon('garlic','마늘','garlic','#dce4ad',5,.8,'주변 적에게 피해를 주고 밀쳐냅니다.');
weapon('water','성수','water','#659ffa',10,3.5,'병이 떨어진 자리에 피해를 주는 성수 웅덩이를 만듭니다.');

weapon('pentagram','오망성','pentagram','#ef83ac',99999,65,'화면의 일반 적을 지웁니다. 낮은 단계에서는 경험치도 소멸할 수 있습니다.');
weapon('peach','하얀 비둘기','bird','#edece0',10,3.2,'시계 방향으로 도는 표적에 폭격합니다.');
weapon('ebony','검은 비둘기','bird','#b19dcc',10,3.2,'반시계 방향으로 도는 표적에 폭격합니다.');
weapon('redgun','피에라 데르 투펠로','gun','#ee7759',5,1.2,'대각선 네 방향으로 붉은 탄환을 쏩니다.');
weapon('bluegun','에잇 더 스패로우','gun','#8fcbd9',5,1.2,'대각선 네 방향으로 푸른 탄환을 쏩니다.');
weapon('song','마나의 노래','song','#c2eeae',10,2.3,'위아래로 뻗은 마력의 기둥이 적을 관통합니다.');
weapon('pinion','그림자 송곳','pinion','#b596e3',12,1.1,'이동할 때 송곳을 남기고 멈추면 바라보는 방향으로 날립니다.');
weapon('cats','고양이','cats','#d4a77d',10,4,'고양이들이 돌아다니며 적을 할퀴고 싸움 구역을 만듭니다.');
weapon('lancet','시계 바늘','lancet','#b4e6ed',0,1.5,'시계 방향으로 회전하는 광선이 적을 얼립니다.',7);
weapon('laurel','월계수','laurel','#84d2ab',0,8,'보호막이 접촉 피해를 막아줍니다.',7);
weapon('vento','성스러운 바람','vento','#efacbb',2,.65,'계속 이동할수록 강해지는 연속 베기입니다.');
weapon('bone','뼈다귀','bone','#e7e0c9',5,2.2,'적에게 부딪히면 다른 방향으로 튕깁니다.');

 for(const ch of CH){let b=document.createElement('button');b.className='character';b.dataset.id=ch.id;b.innerHTML=`<span class="char-name">${ch.name}</span><span class="char-portrait"></span><span class="char-weapon">${W[ch.weapon].name}</span>`;let c=document.createElement('canvas');c.width=48;c.height=64;c.getContext('2d').drawImage(sprite(ch.id==='mortaccio'?'skeleton':'hero',ch.color),0,4);b.querySelector('.char-portrait').append(c);b.onclick=()=>{selectedChar=ch.id;selectionUpdate();};$('roster').append(b);}for(const m of MAPS){const b=document.createElement('button');b.className='map-button';b.dataset.id=m.id;b.innerHTML=`<canvas width="150" height="66"></canvas><span>${m.name}</span>`;const g=b.firstChild.getContext('2d');g.fillStyle=m.floor;g.fillRect(0,0,150,66);g.fillStyle=m.tile;for(let y=0;y<66;y+=12)for(let x=0;x<150;x+=16)g.fillRect(x+1,y+1,14,10);g.fillStyle=m.accent;if(m.id==='forest'){for(let i=0;i<8;i++)g.fillRect(i*21,15+i%3*14,8,17);}else if(m.id==='library'){g.fillRect(0,0,150,10);g.fillRect(0,56,150,10);}else if(m.id==='tower'){g.fillRect(0,0,30,66);g.fillRect(120,0,30,66);}else{for(let x=20;x<140;x+=40)g.fillRect(x,20,10,28);}b.onclick=()=>{selectedMap=m.id;selectionUpdate();};$('maps').append(b);}

function selectionUpdate(){const ch=CH.find(c=>c.id===selectedChar);document.querySelectorAll('.character').forEach(b=>b.classList.toggle('selected',b.dataset.id===selectedChar));document.querySelectorAll('.map-button').forEach(b=>b.classList.toggle('selected',b.dataset.id===selectedMap));const stats=ch.desc.split(/(?<=[.!])\s+/).filter(s=>s.trim());$('char-detail').innerHTML=`<div class="char-head"><canvas class="char-head-portrait" width="48" height="64"></canvas><div><div class="eyebrow">${ch.title}</div><h2 style="margin:2px 0 0">${ch.name}</h2></div></div><ul class="stat-list">${stats.map(s=>`<li><span class="stat-dot"></span><span>${s}</span></li>`).join('')}</ul><div class="equip">${iconHTML(ch.weapon)}<span>시작 무기 · ${W[ch.weapon].name}</span></div>`;$('char-detail').querySelector('.char-head-portrait').getContext('2d').drawImage(sprite(ch.id==='mortaccio'?'skeleton':'hero',ch.color),0,4);$('map-desc').textContent=MAPS.find(m=>m.id===selectedMap).desc;$('mode-desc').textContent=selectedMode==='normal'?'전장 시간과 실제 시간이 같습니다. 선택창과 일시정지 시간은 제외됩니다.':selectedMode==='hurry'?'전장 시계가 2배로 흐릅니다. 일반과 구분해서 기록합니다.':'전장 시계 6배, 공격력·회복·경험치 보너스. 연습은 금화와 랭킹에 저장되지 않습니다.';}
function rankScreen(){state='ranks';panel(`<div class="heading"><div><div class="eyebrow">살아남은 자들의 이름</div><h2>명예의 전당 · 상위 5명</h2></div><button id="rank-back">돌아가기</button></div><div class="settings"><select id="rank-map" aria-label="전장 필터"><option value="all">모든 전장</option>${MAPS.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select><select id="rank-mode" aria-label="모드 필터"><option value="all">모든 기록</option><option value="normal">일반</option><option value="hurry">서두르기</option></select></div><div id="rank-rows"></div><div class="note" style="margin-top:18px">점수 = 처치 × 10 ＋ 생존 초 × 5 ＋ 금화 ＋ 레벨 × 100 ＋ 30분 생존 보너스 10,000.<br>이 브라우저에만 저장됩니다. 다른 컴퓨터와 자동으로 공유되지 않습니다. 고속 여부와 영구 강화 사용량은 기록에 표시됩니다.</div>`,true);$('rank-back').onclick=home;$('rank-map').value=rankMap;$('rank-mode').value=rankMode;const update=()=>{rankMap=$('rank-map').value;rankMode=$('rank-mode').value;const rows=save.ranks.filter(r=>(rankMap==='all'||r.map===rankMap)&&(rankMode==='all'||r.mode===rankMode)).sort((a,b)=>b.score-a.score||b.kills-a.kills);$('rank-rows').innerHTML=ranksHTML(rows)+rows.slice(0,5).map((r,i)=>`<div class="small muted">${i+1}위 · ${r.hyper?'고속':'기본 속도'} · 영구 강화 ${r.power||0}단계 · ${esc(r.date||'')}</div>`).join('');};$('rank-map').onchange=update;$('rank-mode').onchange=update;update();}
function shopScreen(){state='shop';panel(`<div class="heading"><div><h2>영구 강화</h2><p class="gold">보유 금화 ${Math.floor(save.coins).toLocaleString('ko-KR')}</p></div><button id="shop-back">돌아가기</button></div><div class="upgrade-shop">${SHOP.map(([id,name,max,base,desc])=>{const l=up(id),cost=base*(l+1);return `<button data-buy="${id}" ${l>=max||save.coins<cost?'disabled':''}><h3>${name} <small>${l} / ${max}</small></h3><p class="small muted">${desc}</p><div class="gold small">${l>=max?'최대 강화':cost+' 금화'}</div></button>`;}).join('')}</div><p class="small muted" style="margin-top:16px">모든 캐릭터에 적용됩니다. 강화 가격은 이 게임용으로 조정했습니다.</p>`);$('shop-back').onclick=home;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const [id,,max,base]=SHOP.find(x=>x[0]===b.dataset.buy),cost=base*(up(id)+1);if(up(id)<max&&save.coins>=cost){save.coins-=cost;save.upgrades[id]=up(id)+1;persist();shopScreen();}});}
const SOURCES=[['공식 게임 소개','https://poncle.games/vampire-survivors'],['무기와 기본 동작','https://vampire-survivors.fandom.com/wiki/Weapons'],['장신구 효과','https://vampire-survivors.fandom.com/wiki/Passive_items'],['진화와 합체 조건 교차 확인','https://primagames.com/tips/vampire-survivors-weapon-evolution-chart'],['진화 조합표 교차 확인','https://progameguides.com/vampire-survivors/vampire-survivors-evolution-chart/'],['광기의 숲 시간표','https://vampire-survivors.fandom.com/wiki/Mad_Forest'],['도서관 구조와 바닥 장신구','https://vampire-survivors.fandom.com/wiki/Inlaid_Library'],['캐릭터별 특성','https://vampire-survivors.fandom.com/wiki/Characters'],['포위 식물 등장 시점','https://vampire-survivors.fandom.com/wiki/Flower_Wall'],['초기 숲 상자의 진화 예외','https://steamcommunity.com/app/1794680/discussions/0/3809532960779403170/']];
function openBook(tab='weapons',back='pause'){bookReturn=back;state='book';const tabs=[['weapons','무기'],['evolution','진화 · 합체'],['passives','장신구'],['characters','캐릭터'],['waves','습격 시간표'],['help','안내 · 조사 기록']];let body='';
 if(tab==='weapons')body=`<table><tr><th scope="col">무기</th><th scope="col">최대 단계</th><th scope="col">동작</th></tr>${Object.values(W).filter(w=>!w.evolved).map(w=>`<tr><td>${iconHTML(w.id)} ${w.name}</td><td>${w.max}</td><td>${w.desc}</td></tr>`).join('')}</table>`;
 if(tab==='evolution')body=`<p class="note">기본 무기를 최대 단계로 올리고 필요한 장신구를 소지한 뒤, 진화 가능한 상자를 여세요. 장신구는 유지됩니다. 은·금 반지 및 좌·우 표식은 모두 9단계가 필요합니다. 두 무기 합체는 무기 한 칸을 비웁니다.</p><table><tr><th scope="col">완성 무기</th><th scope="col">필요 조합</th><th scope="col">변화</th></tr>${E.map(e=>`<tr><td>${iconHTML(e.id)} ${e.name}</td><td>${recipe(e)}${game?(canEvolve(e)?'<div class="gold">조건 충족 · 진화 상자 필요</div>':''):''}</td><td>${e.desc}</td></tr>`).join('')}</table>`;
 if(tab==='passives')body=`<p class="note">레벨 상승으로 얻는 장신구는 6종까지. 바닥의 장신구는 6칸을 채운 뒤에도 추가로 획득할 수 있습니다. 은·금 반지와 좌·우 표식은 전장의 먼 곳에 있습니다.</p><table><tr><th scope="col">장신구</th><th scope="col">최대 단계</th><th scope="col">효과</th></tr>${Object.values(P).map(p=>`<tr><td>${iconHTML(p.id)} ${p.name}</td><td>${p.max}</td><td>${p.desc}</td></tr>`).join('')}</table>`;
 if(tab==='characters')body=`<table><tr><th scope="col">캐릭터</th><th scope="col">시작 무기</th><th scope="col">특성</th></tr>${CH.map(c=>`<tr><td>${c.name}</td><td>${W[c.weapon].name}${c.id==='pugnala'?' ＋ 에잇 더 스패로우':''}</td><td>${c.desc}</td></tr>`).join('')}</table>`;
 if(tab==='waves')body=`<p class="note">광기의 숲 기준. 원작의 적 교체·주요 포위 시점을 참고했지만, 아래 목표 개체 수와 보충 간격은 이 게임의 조정값입니다. 저주·고속·전장에 따라 달라지며 전체 적 수는 성능을 위해 제한됩니다.</p><table><tr><th scope="col">전장 시간</th><th scope="col">적 편성</th><th scope="col">목표 수 / 보충 간격</th><th scope="col">사건</th></tr>${FOREST.map((f,i)=>`<tr><td>${String(i).padStart(2,'0')}:00</td><td>${f.map(k=>EN[k].name).join(' · ')}</td><td>${MINIMUM[i]} / ${SPAWN[i]}초</td><td>${BOSS_TIMES.includes(i)?'엘리트 등장 ':''}${[5,10,15,25].includes(i)?' · 식물 포위':''}</td></tr>`).join('')}<tr><td>30:00</td><td>붉은 사신</td><td>매 1분 추가</td><td>30분 생존 달성</td></tr></table>`;
 if(tab==='help')body=`<div class="book-copy"><h3>조작과 진행</h3><p>방향키 또는 영문 자판의 이동 네 키로 이동합니다. 마우스나 손가락으로 전장을 드래그해도 됩니다. 공격은 자동이며 단검과 채찍은 마지막 이동 방향을 따릅니다. 공백 키 또는 탈출 키로 일시정지합니다. 선택창에서는 숫자 1·2·3·4 또는 버튼으로 선택하세요. 창을 벗어나면 자동으로 일시정지됩니다.</p><p>적이 떨어뜨린 보석으로 성장하고 무기 6종, 장신구 6종을 조합하세요. 횃불을 공격하면 회복 음식·금화·자석·십자가·시계가 나옵니다. 자석은 모든 보석을 끌어오고, 십자가는 일반 적을 없애며, 시계는 적을 얼립니다. 엘리트를 처치하면 상자가 떨어집니다. 바닥 장신구와 상자는 화면에 표시되지 않으니 직접 탐험해서 찾아야 합니다.</p><h3>상자와 시간</h3><p>상자는 보스를 만났던 시점으로 판정합니다. 일반적으로 10분 이후 등장한 보스의 상자에서 진화합니다. 숲의 1분 보스와 공장·대성당의 초기 상자는 예외입니다. 30분에는 사신이 등장합니다. 이후 쓰러져도 30분 생존 성공으로 기록됩니다. 연습 모드는 전장 시계가 6배 빠르고 랭킹·금화 저장이 제외됩니다.</p><h3>이번 파일의 구현 범위</h3><p>기본 무기 24종, 진화·합체 결과 20종, 장신구 20종, 캐릭터 16명, 전장 5종을 담았습니다. 세 합체인 두 비둘기, 쌍권총＋티라미수, 성스러운 바람＋피눈물이 동작합니다. 캐릭터와 전장은 처음부터 선택 가능합니다.</p><p>원작 실행 파일을 옮긴 것이 아닌 독립 재구현입니다. 원작의 모든 확장팩·아르카나·모험·비밀 해금·최종 보스전·한계 돌파·온라인 기능은 포함하지 않습니다. 맵은 같은 공간 유형을 참고해 직접 구성했으며 원작 타일 배치와 일치하지 않습니다. 도트 이미지·효과음·배경 음악도 직접 제작했습니다.</p><p>캐릭터의 대표 특성, 무기 역할, 조합 조건, 6＋6 장비 제한, 바닥 장신구 추가 획득, 30분과 사신, 숲의 주요 적 교체·포위 시점을 조사해 반영했습니다. 공격 속도·단계별 증가량·피격 판정·적 체력·이동 속도·출현 수·경험치 곡선·보물 확률·상점 가격·숲 이외의 세부 습격 편성은 이 구현에 맞춰 조정했습니다. 모든 수치가 원작과 동일하지는 않습니다.</p><h3>랭킹과 저장</h3><p>랭킹은 상위 5개만 표시하며 전장과 모드로 필터링할 수 있습니다. 원본 기록은 최대 200개를 이 브라우저에 보관합니다. 브라우저의 데이터 삭제·다른 브라우저·파일 이동에 따라 기록을 사용할 수 없을 수 있습니다. 서버 연결과 컴퓨터 간 공유, 조작 방지 기능은 없습니다.</p><h3>조사 출처 · 2026년 9월 11일 확인</h3><p>위키 원문 일부는 접근 제한이 있어 검색에 노출된 해당 문서의 내용과 복수의 가이드를 대조했습니다. 확인하지 못한 세부 수치를 원작 수치라고 표시하지 않았습니다.</p><ul>${SOURCES.map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noreferrer">${name}</a></li>`).join('')}</ul></div>`;

function canEvolve(e){if(!game||game.weapons[e.id])return false;const w=game.weapons[e.base];if(!w||w.level<W[e.base].max)return false;if(e.id==='vandalier')return(game.weapons.ebony?.level||0)>=8;if(e.id==='phieraggi')return(game.weapons.bluegun?.level||0)>=8&&pl('tiragisu')>0;if(e.id==='fuwala')return!!game.weapons.tear;return e.req.every(id=>pl(id)>=(['corridor','shroud'].includes(e.id)?P[id].max:1));}

function upgrades(ownedOnly=false){const pool=[];for(const w of Object.values(W)){const held=game.weapons[w.id];if(game.banned.has(w.id)||game.consumed.has(w.id))continue;if(held&&held.level<w.max)pool.push({kind:'weapon',id:w.id,level:held.level+1});else if(!ownedOnly&&!held&&!w.evolved&&Object.keys(game.weapons).length<6)pool.push({kind:'weapon',id:w.id,level:1});}for(const p of Object.values(P)){const l=pl(p.id);if(game.banned.has(p.id))continue;if(l&&l<p.max)pool.push({kind:'passive',id:p.id,level:l+1});else if(!ownedOnly&&!l&&Object.keys(game.passives).length<6&&!['silver','goldring','left','right'].includes(p.id))pool.push({kind:'passive',id:p.id,level:1});}return pool;}

function pauseScreen(){if(!game||game.finished)return;state='pause';const s=stats();panel(`<div class="heading"><div><div class="eyebrow">${game.map.name} · ${MODE[game.mode].name}</div><h2>잠시 숨을 고르세요</h2></div><b class="gold">${fmt(game.time)}</b></div><div class="stat-grid"><div class="stat"><b>${Math.ceil(game.hp)} / ${Math.floor(s.maxhp)}</b><span>체력</span></div><div class="stat"><b>${game.kills.toLocaleString('ko-KR')}</b><span>처치</span></div><div class="stat"><b>${revives()}</b><span>남은 부활</span></div></div><p class="small muted">공격력 ${Math.round(s.might*100)}% · 범위 ${Math.round(s.area*100)}% · 재사용 ${Math.round(s.cool*100)}% · 방어 ${s.armor} · 저주 ${Math.round((s.curse-1)*100)}%</p><div class="divider"></div><div class="equip-list">${equipmentHTML()}</div><div class="toolbar"><button class="primary" id="resume">계속하기</button><button id="pause-book">도감 열기</button><button id="fullscreen">전체 화면</button><button id="quit">이번 전투 마치기</button></div>`,true);$('resume').onclick=resumeGame;$('pause-book').onclick=()=>openBook('evolution','pause');$('fullscreen').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>notice('이 브라우저에서는 전체 화면을 사용할 수 없습니다.'));}else document.exitFullscreen?.().catch(()=>{});};$('quit').onclick=()=>{state='confirm';panel(`<h2>이번 전투를 마칠까요?</h2><p style="margin:18px 0">지금까지의 점수와 금화가 기록됩니다. 이 전투로 돌아올 수 없습니다.</p><div class="toolbar"><button id="quit-cancel">계속 플레이</button><button id="quit-confirm" class="primary">전투 마치기</button></div>`,true);$('quit-cancel').onclick=resumeGame;$('quit-confirm').onclick=()=>finishGame('중도 종료');};}

function hash(x,y){let n=Math.imul(x,374761393)+Math.imul(y,668265263);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295;}
function obstaclesNear(x,y,map){const out=[],cell=240,cx=Math.floor(x/cell),cy=Math.floor(y/cell);for(let j=cy-1;j<=cy+1;j++)for(let i=cx-1;i<=cx+1;i++){if(Math.abs(i)<1&&Math.abs(j)<1)continue;let ox=i*cell+80,oy=j*cell+70;if(map.id==='forest'&&hash(i,j)>.64)out.push({x:ox,y:oy,w:22,h:28,type:'tree'});if(map.id==='dairy'&&hash(i,j)>.3)out.push({x:ox,y:oy,w:50,h:35,type:'machine'});if(map.id==='chapel')out.push({x:ox,y:oy,w:24,h:38,type:'pillar'});if(map.id==='tower'&&i===0&&Math.abs(j)%3===2)out.push({x:70,y:oy,w:35,h:28,type:'pillar'});}return out;}
function blocked(x,y,r=8){const m=game.map;if(m.id==='library'&&(y-r< -182||y+r>182))return true;if(m.id==='tower'&&(x-r< -210||x+r>210))return true;return game.obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);}

function drawActor(e,cx,cy){const x=Math.floor(e.x-cx+480),y=Math.floor(e.y-cy+270);if(x< -70||x>1030||y< -80||y>620)return;const def=EN[e.type],scale=e.boss?2.1:['mantis','mummy','knight','bigbat'].includes(e.type)?1.4:1;ctx.fillStyle='#0004';ctx.fillRect(x-10*scale,y+5*scale,20*scale,5*scale);ctx.save();ctx.imageSmoothingEnabled=true;if(e.flash>0)ctx.globalAlpha=.55;if(e.frozen>0||game.freeze>0){ctx.fillStyle='#a2e8f833';ctx.fillRect(x-13*scale,y-19*scale,26*scale,31*scale);}ctx.drawImage(sprite(def.shape,def.color,Math.floor(game.real*(e.type==='bat'?12:5)+e.id)%2),x-12*scale,y-19*scale,24*scale,28*scale);ctx.restore();if(e.boss){ctx.fillStyle='#1e1214';ctx.fillRect(x-24,y-29*scale,48,5);ctx.fillStyle=e.type==='reaper'?'#e16878':'#d49b60';ctx.fillRect(x-23,y-29*scale+1,46*Math.max(0,e.hp/e.maxhp),3);}}
function drawPlayer(cx,cy){const x=Math.floor(game.x-cx+480),y=Math.floor(game.y-cy+270),s=game.s||stats();ctx.fillStyle='#0007';ctx.fillRect(x-12,y+9,25,6);if(game.shield>0){ctx.strokeStyle=game.weapons.shroud?'#ed8899':'#bce3ad';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-3,23+Math.sin(game.real*4)*2,0,TAU);ctx.stroke();for(let i=0;i<game.shield;i++){ctx.fillStyle='#eedcb5';ctx.fillRect(x-7+i*6,y-31,4,4);}}ctx.save();ctx.imageSmoothingEnabled=true;if(game.invuln>0&&Math.floor(game.real*14)%2)ctx.globalAlpha=.45;ctx.translate(x,y);if(game.dirX<0)ctx.scale(-1,1);ctx.drawImage(sprite(game.char.id==='mortaccio'?'skeleton':'hero',game.char.color,game.moving?Math.floor(game.real*9)%2:0),-15,-22,30,35);ctx.restore();ctx.fillStyle='#231c1a';ctx.fillRect(x-21,y+19,42,6);ctx.fillStyle='#423333';ctx.fillRect(x-20,y+20,40,4);ctx.fillStyle=game.hp<s.maxhp*.25?'#eb7883':'#b9495d';ctx.fillRect(x-20,y+20,40*clamp(game.hp/s.maxhp,0,1),4);}
function render(){const map=game?game.map:MAPS[0],cx=game?game.x:Math.sin(menuTime*.07)*130,cy=game?game.y:menuTime*7;ctx.save();if(game?.shake>0)ctx.translate(rand(-2,2),rand(-2,2));drawBackground(map,cx,cy);if(game){for(const a of game.areas)drawArea(a,cx,cy);for(const o of game.loot)drawLoot(o,cx,cy);for(const t of game.torches)if(!t.dead){const x=Math.floor(t.x-cx+480),y=Math.floor(t.y-cy+270);ctx.fillStyle='#958162';ctx.fillRect(x-2,y-8,4,16);ctx.fillStyle='#cc793f';ctx.fillRect(x-5,y-19,10,11);ctx.fillStyle='#f4cb75';ctx.fillRect(x-3,y-22+Math.floor(menuTime*10)%3,6,12);ctx.fillStyle='#fff0b0';ctx.fillRect(x-1,y-16,2,6);}const drawables=game.enemies.filter(e=>!e.dead).map(e=>({y:e.y,enemy:e}));const obs=[];for(let oy=-240;oy<=240;oy+=240)for(let ox=-480;ox<=480;ox+=240)obs.push(...obstaclesNear(cx+ox,cy+oy,map));const unique=new Map(obs.map(o=>[o.x+','+o.y,o]));for(const o of unique.values())drawables.push({y:o.y+o.h,obstacle:o});drawables.push({y:game.y,player:true});drawables.sort((a,b)=>a.y-b.y);for(const a of drawables){if(a.player)drawPlayer(cx,cy);else if(a.enemy)drawActor(a.enemy,cx,cy);else drawObstacle(a.obstacle,cx,cy);}for(const b of game.shots)drawShot(b,cx,cy);for(const f of game.fx){const x=f.x-cx+480,y=f.y-cy+270;ctx.save();ctx.globalAlpha=f.life/f.total;ctx.strokeStyle=f.color;ctx.fillStyle=f.color;if(f.type==='burst'){const r=f.r*(1-f.life/f.total);ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();ctx.globalAlpha*=.06;ctx.fillRect(0,0,960,540);}else if(f.type==='line'){ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(f.angle)*f.length,y+Math.sin(f.angle)*f.length);ctx.stroke();}else{for(let i=0;i<4;i++){const a=i/4*TAU,d=(1-f.life/f.total)*18;ctx.fillRect(x+Math.cos(a)*d,y+Math.sin(a)*d,3,3);}}ctx.restore();}ctx.font='bold 12px "Malgun Gothic",sans-serif';ctx.textAlign='center';for(const t of game.texts){const x=t.x-cx+480,y=t.y-cy+270;ctx.globalAlpha=Math.min(1,t.life*3);ctx.fillStyle='#161715';ctx.fillText(t.text,x+1,y+1);ctx.fillStyle=t.color;ctx.fillText(t.text,x,y);}ctx.globalAlpha=1;if(game.freeze>0){ctx.fillStyle='#abdfff0c';ctx.fillRect(0,0,960,540);}}else{for(let i=0;i<30;i++){const x=100+hash(i,2)*760+Math.sin(menuTime*.3+i)*40,y=100+hash(i,3)*350;ctx.drawImage(sprite(i%3?'skeleton':'bat',i%3?'#adb497':'#8b7e9c',Math.floor(menuTime*5+i)%2),x,y,24,28);}}ctx.restore();}
function frame(now){const dt=Math.min(.15,(now-last)/1000||0);last=now;menuTime+=dt;if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)$('notice').style.opacity=0;}if(state==='playing'){acc+=dt;let steps=0;while(acc>=1/60&&steps<9&&state==='playing'){update(1/60);acc-=1/60;steps++;}}else acc=0;render();requestAnimationFrame(frame);}
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLSelectElement)return;const move=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'];if(move.includes(e.code)){if(state==='playing')e.preventDefault();keys.add(e.code);}if(e.repeat)return;if(e.code==='Space'||e.code==='Escape'){if(state==='playing'){e.preventDefault();pauseScreen();}else if(state==='pause'){e.preventDefault();resumeGame();}}if(state==='levelup'&&/^Digit[1-4]$/.test(e.code)){e.preventDefault();chooseUpgrade(Number(e.code.slice(-1))-1);}});
document.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();pointer=null;if(state==='playing')pauseScreen();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pauseScreen();});
canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;audioStart();canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,startX:e.clientX,startY:e.clientY,dx:0,dy:0};$('touch').style.left=(e.clientX-56)+'px';$('touch').style.top=(e.clientY-56)+'px';$('touch').style.bottom='auto';$('touch').style.display='block';$('touch').firstChild.style.transform='translate(0,0)';});canvas.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;const dx=(e.clientX-pointer.startX)/45,dy=(e.clientY-pointer.startY)/45,len=Math.max(1,Math.hypot(dx,dy));pointer.dx=dx/len;pointer.dy=dy/len;$('touch').firstChild.style.transform=`translate(${pointer.dx*32}px,${pointer.dy*32}px)`;});function pointerEnd(e){if(pointer&&pointer.id===e.pointerId){pointer=null;$('touch').style.display='none';}}canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);canvas.addEventListener('lostpointercapture',pointerEnd);$('pause-button').onclick=()=>state==='playing'?pauseScreen():null;$('sound-button').onclick=()=>{save.sound=!save.sound;persist();audioStart();if(!save.sound&&audio?.state==='running')audio.suspend().catch(()=>{});updateHUD(false);};
home();requestAnimationFrame(frame);
</script>
