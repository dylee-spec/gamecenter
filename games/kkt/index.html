<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>끝말잇기 — PLAY LAB</title>
<meta name="description" content="온라인 끝말잇기. 2~8명이 닉네임만으로 바로 시작합니다.">
<meta name="theme-color" content="#e2e2df">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Gothic+A1:wght@800&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ember:#fc5000; --plasma:#524ae9; --sulfur:#f5f28e;
  --limestone:#f7f6f2; --pumice:#e2e2df; --obsidian:#070607; --chalk:#fff;
  --ink-60:#07060799; --ink-45:#07060773;
  --display:"Gothic A1","DM Sans",sans-serif;
  --body:"IBM Plex Sans KR","DM Sans",system-ui,sans-serif;
  --r-card:40px; --r-pill:800px; --r-input:100px;
  --gap:16px; --pad:40px; --max:1280px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pumice);color:var(--obsidian);
  font-family:var(--body);font-weight:500;font-size:16px;line-height:1.55;word-break:keep-all;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.02em;margin:0;line-height:1}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
[hidden]{display:none !important}
.page{max-width:var(--max);margin:0 auto;padding:20px 20px 64px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:var(--gap);
  background:var(--limestone);border-radius:var(--r-pill);padding:10px 12px 10px 24px;margin-bottom:32px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{width:10px;height:10px;border-radius:var(--r-pill);background:var(--ember);display:block}
.nav-right{display:flex;align-items:center;gap:4px}
.ghost{border-radius:var(--r-pill);padding:10px 16px;font-size:14px;color:var(--obsidian);text-decoration:none;display:inline-block}
.ghost:hover{background:#0706070d}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--ember);color:var(--obsidian);border-radius:var(--r-pill);
  padding:12px 24px;min-height:44px;font-size:16px;transition:filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled{background:#0706071a;color:var(--ink-45);cursor:not-allowed}
.btn-line{background:transparent;border:1.5px solid var(--obsidian);border-radius:var(--r-pill);
  padding:12px 24px;min-height:44px;font-size:16px}
.btn-line:hover:not(:disabled){background:#0706070d}
.btn-line:disabled{border-color:#07060733;color:var(--ink-45);cursor:not-allowed}
.btn-sm{padding:9px 18px;min-height:38px;font-size:14px}
.card{background:var(--limestone);border-radius:var(--r-card);padding:var(--pad)}
.card-tight{padding:24px}
.tag{display:inline-block;background:var(--sulfur);color:var(--obsidian);
  border-radius:var(--r-pill);padding:4px 12px;font-size:12px;font-family:var(--body);font-weight:500}
.tag-line{background:transparent;border:1.5px solid #07060733}
.caption{font-size:12px;line-height:1.35;color:var(--ink-60);font-weight:400;margin:0}
.meta{font-size:14px;color:var(--ink-60);margin:0}
.section-label{font-size:12px;letter-spacing:.06em;color:var(--ink-60);font-weight:500;
  margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.input{width:100%;background:var(--chalk);border:1.5px solid #07060726;border-radius:var(--r-input);
  padding:14px 24px;min-height:52px;outline:none;font-weight:500}
.input:focus{border-color:var(--obsidian)}
.input:disabled{background:#0706070a;color:var(--ink-45)}
.input::placeholder{color:var(--ink-45)}
.halftone{border-radius:var(--r-card);background:
  radial-gradient(circle at 1.5px 1.5px, #fc5000cc 1.4px, transparent 1.6px) 0 0/12px 12px,
  linear-gradient(135deg,var(--plasma),var(--ember));min-height:280px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:var(--gap);align-items:stretch}
.hero-copy{display:flex;flex-direction:column;justify-content:center;gap:24px}
.hero h1{font-size:clamp(56px,8.5vw,96px);line-height:.98}
.hero p{margin:0;max-width:26em;color:var(--ink-60)}
.hero form{display:flex;gap:12px;flex-wrap:wrap;max-width:560px}
.hero form .input{flex:1 1 240px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--gap);margin-bottom:24px;flex-wrap:wrap}
.head h2{font-size:48px}
.head .actions{display:flex;gap:8px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--gap)}
.room{display:flex;flex-direction:column;gap:16px;text-align:left}
.room h3{font-size:32px;overflow-wrap:anywhere}
.room dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.room dt{color:var(--ink-60)}
.room dd{margin:0}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.empty h3{font-size:32px}
.room-grid{display:grid;grid-template-columns:320px 1fr;gap:var(--gap);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.players{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.player{display:flex;align-items:center;gap:12px;padding:8px 18px;border-radius:var(--r-pill);
  background:#0706070a;min-height:48px}
.player.turn{background:var(--ember);color:var(--chalk)}
.player .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .sc{font-family:var(--display);font-weight:800;font-size:16px}
.player .sub{font-size:12px;color:var(--ink-60);line-height:1.2}
.player.turn .sub{color:#ffffffcc}
.turn-mark{font-size:12px}
.board{display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.board-top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px;flex-wrap:wrap}
.cue{font-family:var(--display);font-weight:800;font-size:96px;line-height:.95;letter-spacing:.02em}
.timer{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px}
.timer-track{height:14px;border-radius:var(--r-pill);background:#07060714;overflow:hidden}
.timer-fill{height:100%;border-radius:var(--r-pill);background:var(--obsidian);width:100%}
.timer.urgent .timer-fill{background:var(--ember)}
.timer-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;gap:12px}
.answer{display:flex;gap:12px;width:100%;max-width:520px}
.answer .input{flex:1;text-align:center;font-size:20px}
.notice{min-height:26px;font-size:14px;margin:0}
.notice .pill{display:inline-block;background:var(--sulfur);border-radius:var(--r-pill);padding:6px 16px}
.notice.good .pill{background:var(--obsidian);color:var(--chalk)}
.history{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0;padding:0;list-style:none}
.word{background:#0706070a;border-radius:var(--r-pill);padding:8px 16px;font-size:14px}
.word b{font-family:var(--display);font-weight:800;margin-right:6px}
.word.miss{background:var(--sulfur)}
.word .by{color:var(--ink-60);font-size:12px;margin-left:6px}
.chat-log{height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:14px;padding-right:4px}
.chat-log b{font-family:var(--display);font-weight:800;margin-right:6px;font-size:13px}
.chat-form{display:flex;gap:8px;margin-top:12px}
.chat-form .input{padding:10px 20px;min-height:44px;font-size:14px}
.rank{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.rank li{display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:var(--r-pill);background:#0706070a;min-height:48px}
.rank li:first-child{background:var(--ember);color:var(--chalk)}
.rank .no{font-family:var(--display);font-weight:800;width:24px}
.rank .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.rank .sc{font-family:var(--display);font-weight:800}
.scrim{position:fixed;inset:0;background:#07060766;display:grid;place-items:center;padding:20px;z-index:20}
.dialog{background:var(--limestone);border-radius:var(--r-card);padding:32px;width:min(460px,100%);display:flex;flex-direction:column;gap:16px}
.dialog h2{font-size:32px}
.dialog .row{display:flex;gap:8px;flex-wrap:wrap}
.dialog .row>button{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;
  background:var(--obsidian);color:var(--chalk);border-radius:var(--r-pill);padding:14px 24px;font-size:14px;
  display:flex;align-items:center;gap:12px;max-width:min(560px,92vw)}
footer{margin-top:64px;text-align:center}
@media(max-width:900px){
  :root{--pad:24px}
  .hero{grid-template-columns:1fr}
  .halftone{min-height:150px;order:-1}
  .room-grid{grid-template-columns:1fr}
  .head h2{font-size:40px}
  .cue{font-size:72px}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="page">
  <nav class="nav">
    <div class="brand"><i></i>끝말잇기</div>
    <div class="nav-right">
      <button class="ghost" id="soundBtn" aria-pressed="false">소리 켜기</button>
      <a class="ghost" href="../../index.html">게임센터로 가기</a>
    </div>
  </nav>

  <section id="viewGate">
    <div class="hero">
      <div class="hero-copy">
        <h1>끝말잇기</h1>
        <p>닉네임만 정하면 바로 시작합니다. 2~8명이 함께 단어를 이어가고, 이어갈수록 생각할 시간이 10초에서 1초까지 줄어듭니다.</p>
        <form id="gateForm">
          <input class="input" id="nick" maxlength="10" placeholder="닉네임 (1~10자)" autocomplete="nickname" aria-label="닉네임">
          <button class="btn" type="submit" id="gateBtn">닉네임 정하고 시작하기</button>
        </form>
        <p class="caption" id="gateHint">닉네임은 이 브라우저에 저장되어 다음에도 그대로 쓸 수 있습니다.</p>
      </div>
      <div class="halftone" aria-hidden="true"></div>
    </div>
  </section>

  <section id="viewLobby" hidden>
    <div class="head">
      <div>
        <h2>방 목록</h2>
        <p class="meta" id="lobbyCount">방을 불러오는 중입니다</p>
      </div>
      <div class="actions">
        <button class="btn-line btn-sm" id="refreshBtn">목록 새로고침</button>
        <button class="btn btn-sm" id="createBtn">방 만들기</button>
      </div>
    </div>
    <div class="rooms" id="roomList"></div>
  </section>

  <section id="viewRoom" hidden>
    <div class="head">
      <div>
        <h2 id="roomTitle">방</h2>
        <p class="meta" id="roomMeta"></p>
      </div>
      <button class="btn-line btn-sm" id="leaveBtn">방 나가기</button>
    </div>
    <div class="room-grid">
      <div class="stack">
        <div class="card card-tight">
          <div class="section-label"><span>참가자</span><span id="playerCount"></span></div>
          <ul class="players" id="players"></ul>
          <div id="roomAction" class="stack" style="margin-top:16px;gap:8px"></div>
        </div>
        <div class="card card-tight">
          <div class="section-label"><span>대화</span></div>
          <div class="chat-log" id="chatLog"></div>
          <form class="chat-form" id="chatForm">
            <input class="input" id="chatInput" maxlength="200" placeholder="메시지 입력" aria-label="대화 메시지">
            <button class="btn-line btn-sm" type="submit">보내기</button>
          </form>
        </div>
      </div>
      <div class="card" id="boardCard"></div>
    </div>
  </section>

  <footer>
    <p class="caption">PLAY LAB · 끝말잇기 · 단어는 국립국어원 표준국어대사전 명사(CC BY-SA)를 가공해 사용합니다. 닉네임 외의 개인정보는 저장하지 않습니다.</p>
  </footer>
</div>

<script>
'use strict';
const API = 'https://ptwupwbdedgenmbwniwj.supabase.co/rest/v1/rpc/kkt_api';
const KEY = 'sb_publishable_42ATZwFevpMbuN5gL36kxg_FtOqmDL1';
const CLIENT = '1';
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };

function token() {
  let t = localStorage.getItem('kkt_token');
  if (!t || !/^[a-f0-9]{64}$/.test(t)) {
    const b = new Uint8Array(32); crypto.getRandomValues(b);
    t = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
    localStorage.setItem('kkt_token', t);
  }
  return t;
}
async function api(action, data = {}) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY },
    body: JSON.stringify({ p_token: token(), p_action: action, p_data: Object.assign({ client: CLIENT }, data) })
  });
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && (body.message || body.hint)) || '서버에 연결되지 않았습니다. 잠시 후 다시 시도할 수 있습니다.');
  if (body && body.error) throw new Error(body.error);
  return body;
}
async function run(btn, label, fn) {
  const old = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = label; }
  try { return await fn(); }
  finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
}

let actx = null, soundOn = localStorage.getItem('kkt_sound') === 'on';
function ac() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { } } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function beep(f, dur = .08, type = 'triangle', vol = .05, slide) {
  if (!soundOn) return; const a = ac(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const SFX = {
  myTurn() { beep(520, .1, 'triangle', .06, 780); },
  ok() { beep(660, .1, 'triangle', .06, 990); },
  no() { beep(220, .16, 'sawtooth', .05, 120); },
  hurry() { beep(1040, .05, 'square', .04); },
  round() { beep(400, .12, 'triangle', .06, 600); },
  done() { [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, .18, 'triangle', .06), i * 130)); }
};
function paintSound() {
  $('soundBtn').textContent = soundOn ? '소리 끄기' : '소리 켜기';
  $('soundBtn').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
}
$('soundBtn').onclick = () => {
  soundOn = !soundOn; localStorage.setItem('kkt_sound', soundOn ? 'on' : 'off');
  paintSound(); if (soundOn) { ac(); SFX.ok(); }
  toast(soundOn ? '소리를 켰습니다.' : '소리를 껐습니다.');
};
paintSound();

let toastTimer = null;
function toast(text) {
  clearTimeout(toastTimer); document.querySelector('.toast')?.remove();
  const box = el('div', 'toast'); box.append(el('span', '', text));
  document.body.append(box);
  toastTimer = setTimeout(() => box.remove(), 5000);
}
function view(name) { for (const v of ['Gate', 'Lobby', 'Room']) $('view' + v).hidden = (v !== name); }
function dialog(title, bodyNodes, actions) {
  const scrim = el('div', 'scrim'), box = el('div', 'dialog');
  box.append(el('h2', '', title), ...bodyNodes);
  const row = el('div', 'row');
  for (const a of actions) {
    const b = el('button', a.primary ? 'btn' : 'btn-line', a.label);
    b.onclick = () => a.run(box, () => scrim.remove());
    row.append(b);
  }
  box.append(row); scrim.append(box); document.body.append(scrim);
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { scrim.remove(); document.removeEventListener('keydown', esc); }
  });
  setTimeout(() => box.querySelector('input,select,button')?.focus(), 30);
  return scrim;
}

const S = { me: null, nick: null, room: null, st: null, chatSeq: 0, poll: null, raf: null,
  lastRound: 0, lastTurn: null, lastHistory: -1, busy: false, boardBuilt: false };

$('nick').value = localStorage.getItem('kkt_nick') || '';
$('gateForm').onsubmit = async e => {
  e.preventDefault();
  const nick = $('nick').value.trim();
  if (!nick) { $('gateHint').textContent = '닉네임을 입력하면 시작할 수 있습니다.'; $('nick').focus(); return; }
  try {
    await run($('gateBtn'), '시작하는 중…', async () => {
      const me = await api('hello', { nickname: nick });
      S.me = me.id; S.nick = me.nickname;
      localStorage.setItem('kkt_nick', me.nickname);
    });
    openLobby();
  } catch (err) { $('gateHint').textContent = err.message; }
};

async function openLobby() {
  stopPolling(); S.room = null; view('Lobby');
  await loadRooms();
  S.poll = setInterval(loadRooms, 4000);
}
async function loadRooms() {
  let rooms;
  try { rooms = await api('list'); } catch { return; }
  const open = rooms.filter(r => r.status === 'waiting' && r.players < r.max).length;
  $('lobbyCount').textContent = `전체 ${rooms.length}개 방 · 지금 들어갈 수 있는 방 ${open}개 · ${S.nick} 님으로 접속 중`;
  const list = $('roomList'); list.replaceChildren();
  if (!rooms.length) {
    const box = el('div', 'card empty');
    box.append(el('span', 'tag', '방 없음'), el('h3', '', '아직 만들어진 방이 없습니다'),
      el('p', 'meta', '첫 방을 만들면 다른 사람이 들어올 수 있습니다. 2명이 모이면 바로 시작할 수 있습니다.'));
    const b = el('button', 'btn', '방 만들기'); b.onclick = openCreate; box.append(b);
    list.append(box); return;
  }
  for (const r of rooms) {
    const card = el('div', 'card room');
    const playing = r.status === 'playing', full = r.players >= r.max;
    const top = el('div'); top.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';
    top.append(el('span', 'tag', playing ? '게임 중' : r.status === 'finished' ? '게임 끝남' : '대기 중'));
    if (r.locked) top.append(el('span', 'tag tag-line', '비밀번호 필요'));
    const dl = el('dl');
    dl.append(el('dt', '', '방장'), el('dd', '', r.host_name || '없음'),
      el('dt', '', '참가자'), el('dd', '', `${r.players} / ${r.max}명`),
      el('dt', '', '라운드'), el('dd', '', `${r.rounds}라운드`));
    const btn = el('button', 'btn', '이 방 들어가기');
    btn.disabled = playing || full;
    btn.onclick = () => joinRoom(r, btn);
    card.append(top, el('h3', '', r.title), dl, btn);
    if (btn.disabled) card.append(el('p', 'caption', playing
      ? '게임이 끝나면 들어갈 수 있습니다.'
      : '자리가 모두 찼습니다. 다른 방을 고르거나 방을 새로 만들 수 있습니다.'));
    list.append(card);
  }
}
$('refreshBtn').onclick = e => run(e.currentTarget, '불러오는 중…', loadRooms);
$('createBtn').onclick = openCreate;

function field(label, node, hint) {
  const w = el('div', 'field');
  w.append(el('label', '', label), node);
  if (hint) w.append(el('span', 'caption', hint));
  return w;
}
function openCreate() {
  const title = el('input', 'input'); title.maxLength = 24; title.value = `${S.nick} 님의 방`;
  const max = el('select', 'input'), rounds = el('select', 'input'), pw = el('input', 'input');
  for (let n = 2; n <= 8; n++) max.append(new Option(`${n}명`, n));
  max.value = 8;
  for (let n = 1; n <= 10; n++) rounds.append(new Option(`${n}라운드`, n));
  rounds.value = 5;
  pw.type = 'password'; pw.maxLength = 20; pw.placeholder = '없으면 비워 둡니다'; pw.autocomplete = 'off';
  const two = el('div', 'two'); two.append(field('최대 인원', max), field('라운드 수', rounds));
  dialog('방 만들기', [
    field('방 제목', title, '목록에 이 이름으로 보입니다.'),
    two,
    field('비밀번호 (선택)', pw, '입력하면 비밀번호를 아는 사람만 들어올 수 있습니다.')
  ], [
    { label: '만들지 않고 닫기', run: (box, close) => close() },
    { label: '방 만들기', primary: true, run: async (box, close) => {
        const btn = box.querySelector('.btn');
        try {
          const st = await run(btn, '만드는 중…', () => api('create', {
            title: title.value.trim() || `${S.nick} 님의 방`, password: pw.value,
            max: +max.value, rounds: +rounds.value
          }));
          close(); openRoom(st); toast('방을 만들었습니다. 2명이 모이면 시작할 수 있습니다.');
        } catch (err) { toast(err.message); }
      } }
  ]);
}
async function joinRoom(r, btn) {
  if (r.locked) {
    const pw = el('input', 'input'); pw.type = 'password'; pw.maxLength = 20; pw.placeholder = '비밀번호';
    dialog(`${r.title} 들어가기`, [
      el('p', 'meta', '이 방은 비밀번호가 있습니다. 방장에게 받은 비밀번호를 입력하면 들어갈 수 있습니다.'), pw
    ], [
      { label: '들어가지 않고 닫기', run: (box, close) => close() },
      { label: '이 방 들어가기', primary: true, run: async (box, close) => {
          const b = box.querySelector('.btn');
          try {
            const st = await run(b, '들어가는 중…', () => api('join', { room: r.id, password: pw.value }));
            if (st.error) { toast(st.error); return; }
            close(); openRoom(st);
          } catch (err) { toast(err.message); }
        } }
    ]);
    return;
  }
  try {
    const st = await run(btn, '들어가는 중…', () => api('join', { room: r.id }));
    if (st.error) return toast(st.error);
    openRoom(st);
  } catch (err) { toast(err.message); }
}

function stopPolling() { clearInterval(S.poll); S.poll = null; cancelAnimationFrame(S.raf); }
function openRoom(st) {
  stopPolling();
  S.room = st.id; S.chatSeq = 0; S.lastRound = 0; S.lastTurn = null; S.lastHistory = -1; S.boardBuilt = false;
  $('chatLog').replaceChildren();
  view('Room'); apply(st);
  S.poll = setInterval(pollRoom, 850);
}
async function pollRoom() {
  if (!S.room || S.busy) return;
  try { apply(await api('state', { room: S.room, chat_since: S.chatSeq })); } catch { }
}
$('leaveBtn').onclick = () => {
  if (!S.st || S.st.status !== 'playing') return doLeave();
  dialog('게임 도중에 나가기', [
    el('p', 'meta', '지금 나가면 이번 게임의 점수는 남지 않고, 남은 사람끼리 게임을 이어갑니다. 다시 들어오려면 게임이 끝날 때까지 기다려야 합니다.')
  ], [
    { label: '계속 참여하기', run: (box, close) => close() },
    { label: '방 나가기', primary: true, run: (box, close) => { close(); doLeave(); } }
  ]);
};
async function doLeave() {
  const id = S.room; S.room = null; stopPolling();
  try { await api('leave', { room: id }); } catch { }
  toast('방에서 나왔습니다.');
  openLobby();
}
$('chatForm').onsubmit = async e => {
  e.preventDefault();
  const v = $('chatInput').value.trim(); if (!v || !S.room) return;
  $('chatInput').value = '';
  try { apply(await api('chat', { room: S.room, message: v, chat_since: S.chatSeq })); }
  catch (err) { toast(err.message); }
};

function apply(st) {
  if (!st) return;
  if (st.closed || st.left) { toast(st.message || '방이 닫혔습니다.'); S.room = null; stopPolling(); openLobby(); return; }
  const prev = S.st; S.st = st;

  $('roomTitle').textContent = st.title;
  const statusText = st.status === 'playing' ? `${st.round} / ${st.rounds} 라운드 진행 중`
    : st.status === 'finished' ? '게임이 끝났습니다' : '시작을 기다리는 중';
  $('roomMeta').textContent = `${statusText} · 참가자 ${st.players.length} / ${st.max}명${st.locked ? ' · 비밀번호 방' : ''}`;

  const log = $('chatLog');
  for (const m of st.messages || []) {
    S.chatSeq = Math.max(S.chatSeq, m.id);
    if (log.dataset.empty === '1') { log.replaceChildren(); log.dataset.empty = '0'; }
    const line = el('div');
    line.append(el('b', '', m.name), document.createTextNode(m.text));
    log.append(line);
  }
  if (st.messages && st.messages.length) log.scrollTop = log.scrollHeight;
  if (!log.childElementCount) {
    log.dataset.empty = '1';
    log.append(el('p', 'caption', '아직 대화가 없습니다. 첫 메시지를 보내 인사할 수 있습니다.'));
  }

  paintPlayers(st);
  if (st.status === 'playing' && st.round !== S.lastRound) { S.lastRound = st.round; SFX.round(); }
  if (st.status === 'playing' && st.turn_id !== S.lastTurn) {
    S.lastTurn = st.turn_id;
    if (st.turn_id === st.me) SFX.myTurn();
  }
  paintBoard(st, prev);
}

function paintPlayers(st) {
  $('playerCount').textContent = `${st.players.length} / ${st.max}명`;
  const box = $('players'); box.replaceChildren();
  const waiting = st.status !== 'playing';
  for (const p of st.players) {
    const mine = p.id === st.turn_id && st.status === 'playing';
    const li = el('li', 'player' + (mine ? ' turn' : ''));
    const col = el('div'); col.style.cssText = 'flex:1;min-width:0';
    col.append(el('div', 'nm', p.name + (p.me ? ' (나)' : '')),
      el('div', 'sub', p.host ? '방장' : waiting ? (p.ready ? '준비 완료' : '준비 전') : '참가자'));
    li.append(col);
    if (mine) li.append(el('span', 'turn-mark', '차례'));
    if (!(st.status === 'waiting' && st.round === 0)) li.append(el('span', 'sc', String(p.score)));
    box.append(li);
  }
  const act = $('roomAction'); act.replaceChildren();
  if (st.status === 'playing') {
    act.append(el('p', 'caption', '게임이 진행 중입니다. 차례가 되면 오른쪽 입력칸이 열립니다.'));
    return;
  }
  if (st.is_host) {
    const notReady = st.players.filter(p => !p.host && !p.ready).length;
    const b = el('button', 'btn', st.status === 'finished' ? '새 게임 시작하기' : '게임 시작하기');
    b.disabled = st.players.length < 2 || notReady > 0;
    b.onclick = () => run(b, '시작하는 중…', async () => {
      try { apply(await api('start', { room: S.room })); } catch (e) { toast(e.message); }
    });
    act.append(b, el('p', 'caption', b.disabled
      ? (st.players.length < 2
        ? '참가자가 2명 이상이면 시작할 수 있습니다. 이 페이지 주소를 알려 친구를 부를 수 있습니다.'
        : `아직 준비하지 않은 참가자가 ${notReady}명 있습니다. 모두 준비하면 시작할 수 있습니다.`)
      : `시작하면 ${st.players.length}명이 ${st.rounds}라운드를 함께 진행합니다.`));
  } else {
    const me = st.players.find(p => p.me), ready = me && me.ready;
    const b = el('button', ready ? 'btn-line' : 'btn', ready ? '준비 취소하기' : '준비 완료하기');
    b.onclick = () => run(b, '바꾸는 중…', async () => {
      try { apply(await api('ready', { room: S.room })); } catch (e) { toast(e.message); }
    });
    act.append(b, el('p', 'caption', ready ? '방장이 시작하면 바로 게임이 시작됩니다.' : '준비를 마치면 방장이 게임을 시작할 수 있습니다.'));
  }
}

function buildBoard() {
  const c = $('boardCard'); c.replaceChildren();
  const wrap = el('div', 'board');
  const top = el('div', 'board-top');
  top.append(el('span', 'tag', '라운드'), el('span', 'meta', ''));
  const cue = el('div', 'cue', '?');
  const alt = el('p', 'meta', '');
  const timer = el('div', 'timer');
  const row = el('div', 'timer-row');
  row.append(el('span', '', '남은 시간'), el('span', '', ''));
  const track = el('div', 'timer-track'); track.append(el('div', 'timer-fill'));
  timer.append(row, track);
  const guide = el('p', 'caption', '');
  const form = el('form', 'answer');
  const input = el('input', 'input'); input.id = 'wordInput'; input.maxLength = 12; input.autocomplete = 'off';
  input.placeholder = '이어질 단어'; input.setAttribute('aria-label', '이어질 단어');
  const send = el('button', 'btn', '단어 보내기'); send.type = 'submit';
  form.append(input, send); form.onsubmit = submitWord;
  const notice = el('p', 'notice', '');
  const histLabel = el('div', 'section-label'); histLabel.style.width = '100%';
  histLabel.append(el('span', '', '이번 라운드 단어'), el('span', '', ''));
  const hist = el('ul', 'history');
  wrap.append(top, cue, alt, timer, guide, form, notice, histLabel, hist);
  c.append(wrap);
  S.boardBuilt = true;
  return wrap;
}

function paintBoard(st, prev) {
  const c = $('boardCard');
  if (st.status !== 'playing') {
    S.boardBuilt = false;
    c.replaceChildren();
    const box = el('div', 'board');
    if (st.status === 'finished') {
      box.append(el('span', 'tag', '결과'), el('h2', '', `${st.winner_name || '-'} 님이 1위입니다`),
        el('p', 'meta', `${st.rounds}라운드를 모두 마쳤습니다. 방장이 새 게임을 시작하면 점수는 0부터 다시 시작합니다.`));
      const rank = el('ul', 'rank');
      [...st.players].sort((a, b) => b.score - a.score).forEach((p, i) => {
        const li = el('li');
        li.append(el('span', 'no', String(i + 1)), el('span', 'nm', p.name + (p.me ? ' (나)' : '')), el('span', 'sc', String(p.score)));
        rank.append(li);
      });
      box.append(rank);
      if (prev && prev.status === 'playing') SFX.done();
    } else {
      box.append(el('span', 'tag', '대기 중'), el('h2', '', '참가자를 기다리는 중입니다'),
        el('p', 'meta', '끝 글자로 시작하는 단어를 번갈아 입력합니다. 두 글자 이상이면 길이는 자유이고, 표준국어대사전에 있는 단어만 인정됩니다.'),
        el('p', 'meta', `최대 ${st.max}명 · ${st.rounds}라운드 · 제한시간은 10초에서 시작해 점점 줄어듭니다.`));
    }
    c.append(box);
    return;
  }

  const wrap = S.boardBuilt && c.querySelector('.board') ? c.querySelector('.board') : buildBoard();
  const top = wrap.querySelector('.board-top');
  top.children[0].textContent = `${st.round} / ${st.rounds} 라운드`;
  top.children[1].textContent = `이번 라운드 ${st.chain}번째 단어`;
  wrap.querySelector('.cue').textContent = st.cur_char || '?';
  const others = (st.cur_chars || []).filter(ch => ch !== st.cur_char);
  wrap.querySelectorAll('.meta')[1].textContent = others.length
    ? `${st.cur_char} 또는 두음법칙을 적용한 ${others.join(', ')} 로 시작하면 됩니다`
    : `${st.cur_char} 로 시작하는 단어를 입력합니다`;

  const mine = st.turn_id === st.me;
  const who = st.players.find(p => p.id === st.turn_id);
  wrap.querySelector('.timer-row').children[0].textContent = mine
    ? '내 차례 — 남은 시간' : `${who ? who.name : '다른 참가자'} 님의 차례 — 남은 시간`;
  wrap.querySelector('.caption').textContent = mine
    ? 'Enter를 눌러 바로 보낼 수 있습니다.'
    : '차례가 오면 입력칸이 열립니다. 그동안 다음 단어를 생각해 둘 수 있습니다.';

  const input = $('wordInput'), send = input.nextElementSibling;
  input.disabled = !mine; send.disabled = !mine;
  if (!mine) { input.value = ''; input.placeholder = '다른 참가자의 차례입니다'; }
  else {
    input.placeholder = '이어질 단어';
    if (document.activeElement !== input && document.activeElement !== $('chatInput')) input.focus();
  }

  if (st.history.length !== S.lastHistory) {
    S.lastHistory = st.history.length;
    const hist = wrap.querySelector('.history'); hist.replaceChildren();
    wrap.querySelector('.section-label').children[1].textContent = `${st.chain}개 이어짐`;
    if (!st.history.length) hist.append(el('li', 'caption', '이번 라운드의 첫 단어를 기다리는 중입니다.'));
    for (const h of st.history.slice(-12)) {
      const li = el('li', 'word' + (h.ok ? '' : ' miss'));
      if (h.ok) li.append(el('b', '', h.word), el('span', 'by', `${h.name} +${h.score}`));
      else li.append(el('span', '', `${h.name} 시간 초과`), el('span', 'by', String(h.score)));
      hist.append(li);
    }
  }
  startTimer(st, wrap);
}

function startTimer(st, wrap) {
  cancelAnimationFrame(S.raf);
  const timer = wrap.querySelector('.timer'), fill = wrap.querySelector('.timer-fill'),
    secs = wrap.querySelector('.timer-row').children[1];
  const total = st.turn_time || 1, begin = st.remain, t0 = performance.now();
  let lastSec = Math.ceil(begin / 1000);
  const step = () => {
    const left = Math.max(0, begin - (performance.now() - t0));
    const ratio = left / total;
    fill.style.width = (ratio * 100).toFixed(1) + '%';
    timer.classList.toggle('urgent', ratio < .34);
    secs.textContent = `${(left / 1000).toFixed(1)}초 / ${Math.round(total / 1000)}초`;
    const sec = Math.ceil(left / 1000);
    if (sec !== lastSec) { lastSec = sec; if (st.turn_id === st.me && sec <= 3 && sec > 0) SFX.hurry(); }
    if (left > 0) S.raf = requestAnimationFrame(step);
  };
  step();
}

function say(text, good) {
  const n = document.querySelector('.notice');
  if (!n) return;
  n.className = 'notice' + (good ? ' good' : '');
  n.replaceChildren(el('span', 'pill', text));
}
async function submitWord(e) {
  e.preventDefault();
  const input = $('wordInput'), word = input.value.trim();
  if (!/^[가-힣]{2,}$/.test(word)) {
    say('두 글자 이상 한글 단어만 보낼 수 있습니다. 입력한 글자를 고쳐 다시 보낼 수 있습니다.');
    SFX.no(); input.focus(); return;
  }
  S.busy = true;
  try {
    const st = await api('submit', { room: S.room, word, round: S.st.round, chat_since: S.chatSeq });
    if (st.reject) { say(st.reject + ' 다른 단어로 다시 보낼 수 있습니다.'); SFX.no(); }
    else if (st.late) { say('시간이 끝나 이번 차례는 넘어갔습니다. 다음 라운드에서 이어서 할 수 있습니다.'); SFX.no(); }
    else if (st.accepted != null) { say(`${word} 인정 · ${st.accepted}점을 얻었습니다.`, true); input.value = ''; SFX.ok(); }
    apply(st);
  } catch (err) { say(err.message); SFX.no(); }
  finally { S.busy = false; if (!$('wordInput').disabled) $('wordInput').focus(); }
}

addEventListener('pagehide', () => {
  if (!S.room) return;
  try {
    fetch(API, { method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY },
      body: JSON.stringify({ p_token: token(), p_action: 'leave', p_data: { client: CLIENT, room: S.room } }) });
  } catch { }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.room) pollRoom(); });
view('Gate'); $('nick').focus();
</script>
</body>
</html>
