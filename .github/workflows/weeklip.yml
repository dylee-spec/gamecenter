name: 위클립 데이터 수집
on:
  workflow_dispatch:   # 예약 실행 없음. 발행 요청이 있을 때만 수동 실행
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: 데이터 수집 (사이트에는 올리지 않음)
        env:
          WEEKLIP_OUT: draft
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/weeklip/collect.mjs
      - name: 수집 결과 저장 (work/weeklip/draft.json)
        run: |
          git config user.name "weeklip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f work/weeklip/draft.json ] || { echo "수집된 트렌드가 없어요"; exit 0; }
          git add work/weeklip/draft.json
          git diff --cached --quiet && exit 0
          git commit -m "위클립 데이터 수집 결과"
          git push
