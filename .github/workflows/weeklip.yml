name: 위클립 데이터 수집
on:
  workflow_dispatch:   # 예약 실행 없음. 발행 요청이 있을 때만 수동 실행
    inputs:
      formats:
        description: '검증할 유행 포맷 검색어 (쉼표로 구분, 선택)'
        required: false
        default: ''
      week:
        description: '수집할 주 (auto = 일요일엔 이번 주, 그 외엔 지난주 / current = 이번 주 월요일~오늘)'
        type: choice
        options: [auto, current]
        default: auto
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: 구글 클라우드 인증 (BigQuery)
        id: gauth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: gcloud 준비
        if: steps.gauth.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2
      - name: 한국 구글 급상승·인기 검색어 (BigQuery 공개 데이터)
        if: steps.gauth.outcome == 'success'
        continue-on-error: true
        run: |
          bq query --project_id="$GCP_PROJECT" --use_legacy_sql=false --format=json --max_rows=100 "$(cat scripts/weeklip/gtrends_rising.sql)" > /tmp/gtrends_rising.json
          bq query --project_id="$GCP_PROJECT" --use_legacy_sql=false --format=json --max_rows=100 "$(cat scripts/weeklip/gtrends_top.sql)" > /tmp/gtrends_top.json
          echo "rising: $(python3 -c 'import json;print(len(json.load(open("/tmp/gtrends_rising.json"))))') / top: $(python3 -c 'import json;print(len(json.load(open("/tmp/gtrends_top.json"))))')"
        env:
          GCP_PROJECT: weeklip
      - name: 데이터 수집 (사이트에는 올리지 않음)
        env:
          WEEKLIP_OUT: draft
          WEEKLIP_WEEK: ${{ inputs.week }}
          FORMAT_QUERIES: ${{ inputs.formats }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/weeklip/collect.mjs
      - name: 수집 결과 저장 (work/weeklip/draft.json)
        run: |
          git config user.name "weeklip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f work/weeklip/draft.json ] || { echo "수집된 트렌드가 없어요"; exit 0; }
          git add work/weeklip/draft.json
          git diff --cached --quiet && exit 0
          git commit -m "위클립 데이터 수집 결과"
          git push
