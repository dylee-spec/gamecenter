<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빨리 따라와! AI 소식!</title>
<meta name="description" content="매주 월요일, 한 주의 AI 소식과 꿀팁을 5분 안에 따라잡아요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 토스 스타일, 파랑 계열. 글자 크기 40/24/18/16/13, 굵기 500/700. 파랑(#1b64da) = 이 사이트 강조 하나뿐. 본문 글자는 파랑을 쓰지 않음(R7-05).
   이번 주 소식 영역은 React Bits의 AccordionGallery 동작(마우스를 올리면 펼쳐지는 패널)을 정적 페이지용으로 옮긴 것. */
:root{--bg:#f2f4f6;--ink:#191f28;--ink2:#4e5968;--ink3:#5f6b7a;--line:#e5e8eb;--brand:#1b64da;--brand-bg:#e8f3ff;
  --c-chatgpt:#1b64da;--c-claude:#1e3a8a;--c-gemini:#2f55b8;--c-google:#0b4f8f;--c-perplexity:#3d4f9c;--c-etc:#333d4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard Variable,Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;font-weight:500;line-height:1.7;word-break:keep-all}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px 96px}
.top{display:flex;align-items:center;justify-content:space-between;height:64px}
.back{display:inline-flex;align-items:center;min-height:32px;font-size:13px;font-weight:700;color:var(--ink3);text-decoration:none}
.back:hover{color:var(--ink)}
.brand{font-size:13px;font-weight:700;color:var(--ink3)}
.head{padding:24px 0 8px}
.pill{display:inline-block;background:var(--brand-bg);color:var(--brand);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.head h1{margin:16px 0 8px;font-size:40px;line-height:1.25;letter-spacing:-1.2px;font-weight:700}
.head h1 b{color:var(--brand);font-weight:700}
.head p{margin:0;font-size:18px;color:var(--ink2)}
.part{margin:48px 0 16px;font-size:24px;font-weight:700;letter-spacing:-.6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.part small{font-size:13px;font-weight:700;color:var(--ink3);letter-spacing:0}
.new{display:inline-block;background:var(--brand);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:0 10px;line-height:22px}
a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* 펼쳐지는 패널 */
.ag{display:flex;gap:10px;height:460px;width:100%}
.ag-p{position:relative;flex:1 1 0;min-width:0;overflow:hidden;border-radius:20px;display:block;text-decoration:none;color:#fff;cursor:pointer;transition:flex-grow .6s cubic-bezier(.2,.8,.2,1);outline:none;background:var(--c-etc)}
.ag-p.on{flex-grow:4.3}
.ag-p:focus-visible{box-shadow:0 0 0 3px var(--ink)}
.ag-m{position:absolute;inset:0;background:var(--c-etc);transition:filter .6s}
.ag-p:not(.on) .ag-m{filter:grayscale(.75) brightness(.9)}
.ag-m:before{content:attr(data-mark);position:absolute;left:24px;top:64px;font-size:88px;line-height:1;letter-spacing:-3px;font-weight:700;color:rgba(255,255,255,.12);white-space:nowrap}
.ag-m.has-art:before{display:none}
.ag-art{position:absolute;left:0;right:0;top:64px;bottom:128px;display:flex;align-items:center;justify-content:center;padding:0 20px}
.ag-art svg{width:100%;height:100%;max-width:440px}
.ag-p:not(.on) .ag-art{opacity:.8}
.ag-m:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.5) 100%)}
.c-chatgpt{background:var(--c-chatgpt)}.c-claude{background:var(--c-claude)}.c-gemini{background:var(--c-gemini)}.c-google{background:var(--c-google)}.c-perplexity{background:var(--c-perplexity)}
.ag-tag{position:absolute;left:24px;top:22px;font-size:13px;font-weight:700;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 12px;white-space:nowrap}
.ag-p:not(.on) .ag-tag{opacity:0}
.ag-v{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);writing-mode:vertical-rl;font-size:16px;font-weight:700;opacity:0;transition:opacity .4s;white-space:nowrap}
.ag-p:not(.on) .ag-v{opacity:.95}
.ag-l{position:absolute;left:24px;right:24px;bottom:24px;display:flex;align-items:center;gap:12px;opacity:0;transform:translateX(-14px);transition:opacity .5s .1s,transform .5s .1s}
.ag-p.on .ag-l{opacity:1;transform:none}
.ag-bar{flex:none;width:3px;align-self:stretch;border-radius:3px;background:#fff}
.ag-t{display:block;font-size:24px;line-height:1.35;letter-spacing:-.6px;font-weight:700;text-wrap:balance}
.ag-d{display:block;margin-top:4px;font-size:13px;font-weight:700;opacity:.85}
@media(max-width:700px){.ag{flex-direction:column;height:auto}.ag-p{min-height:84px;transition:none}.ag-p.on{min-height:260px}.ag-v{display:none}}
@media(prefers-reduced-motion:reduce){.ag-p,.ag-m,.ag-l,.ag-v{transition:none}}

/* 발행 목록 */
.list{background:#fff;border-radius:24px;padding:8px 32px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover .rt{color:var(--brand)}
.row .l{min-width:0}
.row .rl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink3)}
.row .rl b{font-size:16px;color:var(--ink)}
.row .rt{margin-top:4px;font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.5}
.row .cnt{flex:none;font-size:13px;font-weight:700;color:var(--ink3);text-align:right}
.empty{padding:28px 0;color:var(--ink2)}
.about{margin-top:48px;background:#fff;border-radius:24px;padding:24px 32px;color:var(--ink2)}
.about b{color:var(--ink);font-weight:700}
footer{margin-top:32px;text-align:center;color:var(--ink3);font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../../index.html#work">← 업무센터로 돌아가기</a><span class="brand">PLAY LAB</span></div>
  <header class="head">
    <span class="pill">매주 월요일 발행</span>
    <h1>빨리 따라와! <b>AI 소식!</b></h1>
    <p>이번 주 AI, 5분이면 따라잡아요</p>
  </header>

  <div class="part" id="agHead" hidden></div>
  <div class="ag" id="ag" role="list" aria-label="이번 주 업데이트"></div>

  <div class="part">발행 목록<small id="cnt"></small></div>
  <main class="list" id="list"><div class="empty">불러오는 중이에요…</div></main>

  <section class="about"><b>이 소식은 이렇게 만들어요.</b> 공식 릴리스 노트와 공식 발표를 직접 열어 날짜와 내용을 확인한 것만 싣고, 각 소식 아래에 출처를 달아요. 문장은 쉽게 다시 썼어요.</section>
  <footer>빨리 따라와! AI 소식! · PLAY LAB</footer>
</div>
<script src="art.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function art(n){return (window.AINEWS_ART&&n.art&&window.AINEWS_ART[n.art])||'';}
function tone(tag){const t=String(tag||'').toLowerCase();
  if(t.indexOf('chatgpt')>-1||t.indexOf('openai')>-1)return 'c-chatgpt';if(t.indexOf('claude')>-1)return 'c-claude';
  if(t.indexOf('gemini')>-1)return 'c-gemini';if(t.indexOf('google')>-1)return 'c-google';if(t.indexOf('perplexity')>-1)return 'c-perplexity';return '';}
function setup(panels, start){
  let cur=start;
  const set=i=>{cur=i;panels.forEach((p,k)=>{p.classList.toggle('on',k===i);if(k===i)p.setAttribute('aria-current','true');else p.removeAttribute('aria-current');});};
  panels.forEach((p,i)=>{
    p.addEventListener('mouseenter',()=>set(i));
    p.addEventListener('focus',()=>set(i));
    p.addEventListener('click',e=>{ if(i!==cur){ e.preventDefault(); set(i); } });
    p.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();const n=(i+1)%panels.length;set(n);panels[n].focus();}
      else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();const n=(i-1+panels.length)%panels.length;set(n);panels[n].focus();}
    });
  });
  set(start);
}
fetch('issues.json?_='+Date.now()).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(list=>{
  list.reverse(); // 최신 발행이 맨 위
  const it=list[0], base='issue.html?id='+encodeURIComponent(it.id);
  $('agHead').hidden=false;
  $('agHead').innerHTML=esc(it.label)+' 업데이트 <span class="new">NEW!</span><small>'+esc(it.range)+'</small>';
  $('ag').innerHTML=it.news.map((n,i)=>
    '<a class="ag-p" role="listitem" href="'+base+'#n'+i+'" aria-label="'+esc(n.title)+'"><span class="ag-m '+tone(n.tag)+(art(n)?' has-art':'')+'" data-mark="'+esc(n.tag)+'">'+(art(n)?'<span class="ag-art">'+art(n)+'</span>':'')+'</span>'+
    '<span class="ag-tag">'+esc(n.tag)+'</span><span class="ag-v" aria-hidden="true">'+esc(n.tag)+'</span>'+
    '<span class="ag-l"><span class="ag-bar"></span><span><span class="ag-t">'+esc(n.title)+'</span><span class="ag-d">'+esc(n.date)+'</span></span></span></a>').join('');
  setup([].slice.call(document.querySelectorAll('.ag-p')), Math.min(it.lead||0,it.news.length-1));
  $('cnt').textContent='총 '+list.length+'회';
  $('list').innerHTML=list.map((x,i)=>
    '<a class="row" href="issue.html?id='+encodeURIComponent(x.id)+'"><div class="l"><div class="rl"><b>'+esc(x.label)+'</b><span>'+esc(x.range)+'</span>'+(i===0?'<span class="new">NEW!</span>':'')+'</div>'+
    '<div class="rt">'+esc(String(x.headline).replace(/\n/g,' '))+'</div></div><div class="cnt">업데이트 '+x.news.length+'건<br>꿀팁 '+x.tips.length+'건</div></a>').join('');
}).catch(()=>{ $('list').innerHTML='<div class="empty">목록을 불러오지 못했어요. 페이지를 새로 고쳐 주세요.</div>'; });
</script>
</body>
</html>
