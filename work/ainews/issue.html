<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빨리 따라와! AI 소식!</title>
<meta name="description" content="매주 월요일, 이번 주 AI 소식과 바로 따라 하는 꿀팁을 쉬운 말로 정리해요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 토스 스타일. 글자 크기 5단계(32/24/20/17/14), 굵기 2단계(500/700).
   파랑(#1b64da)은 '핵심·강조' 한 가지 뜻으로만 씀: 브랜드 강조, NEW, 활용법. 본문 글자에는 쓰지 않음(R7-05).
   이미지 칸은 차분한 한 가지 바탕(#eef2f7). 제목은 이미지 위가 아니라 아래에 둠(겹침 방지). */
:root{--bg:#f2f4f6;--surface:#fff;--ink:#191f28;--ink2:#4e5968;--ink3:#5f6b7a;--line:#e5e8eb;--frame:#eef2f7;--soft:#f2f4f6;--brand:#1b64da;--brand-bg:#e8f3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard Variable,Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;font-weight:500;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}

/* 맨 위 */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.top a{display:inline-flex;align-items:center;min-height:32px;font-size:14px;color:var(--ink3);text-decoration:none}
.top a:hover{color:var(--ink)}
.top .brand{display:inline-block;line-height:32px;font-size:17px;font-weight:700;color:var(--ink)}
.top .brand b{color:var(--brand);font-weight:700}

/* 이번 호 제목 */
.hero{padding:24px 0 32px}
.kicker{margin:0 0 8px;font-size:14px;color:var(--ink3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kicker strong{color:var(--ink);font-weight:700}
.new{display:inline-block;background:var(--brand);color:#fff;font-size:14px;font-weight:700;border-radius:999px;padding:0 10px;line-height:24px}
.hero h1{font-size:32px;line-height:1.35;letter-spacing:-.02em;white-space:pre-line}

/* 흰 판 */
.card{background:var(--surface);border-radius:24px;padding:32px;margin-bottom:16px}
.card>h2{font-size:24px;line-height:1.35;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.card>h2 small{font-size:14px;font-weight:500;color:var(--ink3);letter-spacing:0}

/* 이번 주 한눈에 */
.glance .grp{margin:24px 0 4px;font-size:14px;font-weight:700;color:var(--ink3)}
.glance ol{list-style:none;margin:0;padding:0}
.glance li a{display:flex;gap:16px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);text-decoration:none}
.glance li:first-child a{border-top:0}
.glance .svc{flex:none;width:96px;font-size:14px;color:var(--ink3)}
.glance .t{font-weight:700}
.glance .s{display:block;font-weight:500;color:var(--ink2)}
.glance li a:hover .t{text-decoration:underline;text-underline-offset:3px}
.glance .tips{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.glance .tips li a{padding:12px 0;flex-direction:column;gap:0}
.glance .tips .svc{width:auto}
.glance .tips li:nth-child(2) a{border-top:0}
.glance .more{margin:16px 0 0;font-size:14px;color:var(--ink3)}
.glance .more a{color:var(--ink2)}

/* 소식 하나 */
.item{padding:32px 0;border-top:1px solid var(--line);scroll-margin-top:16px}
.card>h2+.item{border-top:0;padding-top:24px}
.banner{position:relative;margin:0 0 16px;aspect-ratio:3/1;border-radius:16px;background:var(--frame);overflow:hidden;display:flex;align-items:center;justify-content:center}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.banner .art{height:86%;display:flex;align-items:center;justify-content:center}
.banner .art svg{height:100%;width:auto;filter:drop-shadow(0 8px 18px rgba(25,31,40,.12))}
.banner.has-pic .art{display:none}
.meta{margin:0 0 6px;font-size:14px;color:var(--ink3)}
.item h3{font-size:20px;line-height:1.45;letter-spacing:-.02em}
.sum{margin:6px 0 16px}
.use{display:flex;gap:12px;background:var(--brand-bg);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.use b{flex:none;font-size:14px;font-weight:700;color:var(--brand);line-height:29px}
.body{margin:0 0 12px}
.item ol.steps{margin:0 0 12px;padding:0;list-style:none;counter-reset:s}
.item ol.steps li{counter-increment:s;display:flex;gap:12px;margin-bottom:6px}
.item ol.steps li:before{content:counter(s);flex:none;width:26px;height:26px;margin-top:2px;border-radius:50%;background:var(--soft);color:var(--ink);font-size:14px;font-weight:700;display:grid;place-items:center;line-height:1}
.pbox{background:var(--soft);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.pbox .lbl{display:block;font-size:14px;font-weight:700;color:var(--ink3)}
.pbox pre{margin:4px 0 12px;white-space:pre-wrap;font:inherit;color:var(--ink)}
.copy{border:0;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:700;min-height:36px;padding:0 16px;border-radius:999px;cursor:pointer}
.copy:hover{background:#333d4b}
.note{margin:0 0 12px;color:var(--ink2)}
.note b{color:var(--ink);font-weight:700;margin-right:6px}
.src{display:inline-flex;align-items:center;min-height:32px;font-size:14px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px}
.src:hover{color:var(--ink)}

/* 용어 풀이 */
.terms{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;column-gap:24px}
.terms dt{font-weight:700;padding:12px 0;border-top:1px solid var(--line)}
.terms dd{margin:0;padding:12px 0;border-top:1px solid var(--line);color:var(--ink2)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}

.about{margin:8px 0 0;font-size:14px;color:var(--ink3);padding:0 8px}
footer{padding:32px 0 64px;text-align:center;font-size:14px;color:var(--ink3)}
.err{background:var(--surface);border-radius:24px;padding:28px;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:640px){
  .card{padding:24px 20px}
  .hero h1{font-size:24px}
  .glance .tips{grid-template-columns:1fr}
  .glance .tips li:nth-child(2) a{border-top:1px solid var(--line)}
  .glance li a{flex-direction:column;gap:2px}
  .terms{grid-template-columns:1fr}
  .terms dd{border-top:0;padding-top:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="index.html">← 발행 목록으로 돌아가기</a>
    <a class="brand" href="index.html">빨리 따라와! <b>AI 소식!</b></a>
  </header>

  <main id="main"><div class="err">불러오는 중이에요…</div></main>

  <footer>빨리 따라와! AI 소식! · PLAY LAB</footer>
</div>
<p class="sr" aria-live="polite" id="live"></p>

<script src="art.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okUrl = u => /^https:\/\//.test(u || '');
function svcName(n){ return n.tag || n.tool || ''; }
function banner(n){
  const a = (window.AINEWS_ART && n.art && window.AINEWS_ART[n.art]) || '';
  const pic = okUrl(n.img);
  return '<figure class="banner' + (pic ? ' has-pic' : '') + '">' +
    (a ? '<span class="art">' + a + '</span>' : '') +
    (pic ? '<img src="' + esc(n.img) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove(\'has-pic\');this.remove()">' : '') +
    '</figure>';
}
function item(n, i, kind){
  const meta = [svcName(n), n.date || n.when, (okUrl(n.img) && n.imgsrc) ? '이미지: ' + n.imgsrc : ''].filter(Boolean).map(esc).join(' · ');
  return '<article class="item" id="' + kind + i + '" aria-labelledby="' + kind + i + 'h">' + banner(n) +
    '<p class="meta">' + meta + '</p>' +
    '<h3 id="' + kind + i + 'h">' + esc(n.title) + '</h3>' +
    (n.sum ? '<p class="sum">' + esc(n.sum) + '</p>' : '') +
    (n.use ? '<div class="use"><b>활용법</b><span>' + esc(n.use) + '</span></div>' : '') +
    (n.steps ? '<ol class="steps">' + n.steps.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol>' : (n.body ? '<p class="body">' + esc(n.body) + '</p>' : '')) +
    (n.prompt ? '<div class="pbox"><span class="lbl">그대로 복사해서 쓰는 프롬프트</span><pre>' + esc(n.prompt) + '</pre><button type="button" class="copy">프롬프트 복사하기</button></div>' : '') +
    ((n.detail || n.note) ? '<p class="note"><b>참고</b>' + esc(n.detail || n.note) + '</p>' : '') +
    '<a class="src" href="' + (okUrl(n.url) ? esc(n.url) : '#') + '" target="_blank" rel="noopener">출처 보기: ' + esc(n.src) + ' (새 창)</a></article>';
}
function render(list, id){
  const latest = list[0];
  const it = list.find(x => x.id === id) || latest;
  document.title = it.label + ' · 빨리 따라와! AI 소식!';
  const terms = it.terms || [];
  const glance =
    '<section class="card glance" aria-labelledby="gh"><h2 id="gh">이번 주 한눈에</h2>' +
    '<p class="grp">업데이트 ' + it.news.length + '건</p><ol>' +
    it.news.map((n,i) => '<li><a href="#n' + i + '"><span class="svc">' + esc(svcName(n)) + '</span><span><span class="t">' + esc(n.title) + '</span>' + (n.sum ? '<span class="s">' + esc(n.sum) + '</span>' : '') + '</span></a></li>').join('') +
    '</ol><p class="grp">꿀팁 ' + it.tips.length + '건</p><ol class="tips">' +
    it.tips.map((t,i) => '<li><a href="#t' + i + '"><span class="svc">' + esc(svcName(t)) + '</span><span class="t">' + esc(t.title) + '</span></a></li>').join('') +
    '</ol>' + (terms.length ? '<p class="more">모르는 말이 나오면 맨 아래 <a href="#terms">용어 풀이</a>를 보세요.</p>' : '') + '</section>';
  $('main').innerHTML =
    '<section class="hero"><p class="kicker"><strong>' + esc(it.label) + '</strong><span>' + esc(it.range) + '</span>' + (it === latest ? '<span class="new">NEW!</span>' : '') + '</p>' +
    '<h1>' + esc(it.headline) + '</h1></section>' + glance +
    '<section class="card" id="updates" aria-labelledby="uh"><h2 id="uh">업데이트<small>' + it.news.length + '건</small></h2>' + it.news.map((n,i) => item(n,i,'n')).join('') + '</section>' +
    '<section class="card" id="tips" aria-labelledby="th"><h2 id="th">꿀팁<small>' + it.tips.length + '건</small></h2>' + it.tips.map((t,i) => item(t,i,'t')).join('') + '</section>' +
    (terms.length ? '<section class="card" id="terms" aria-labelledby="dh"><h2 id="dh">용어 풀이<small>' + terms.length + '개</small></h2><dl class="terms">' + terms.map(t => '<dt>' + esc(t.t) + '</dt><dd>' + esc(t.d) + '</dd>').join('') + '</dl></section>' : '') +
    '<p class="about">공식 발표와 공식 릴리스 노트에서 날짜와 내용을 직접 확인한 소식만 실어요. 각 소식 아래 출처를 눌러 원문을 볼 수 있어요.</p>';
  document.querySelectorAll('.copy').forEach(b => b.onclick = () => {
    const t = b.previousElementSibling.textContent;
    const done = () => { b.textContent = '복사했어요'; $('live').textContent = '프롬프트를 복사했어요'; setTimeout(() => { b.textContent = '프롬프트 복사하기'; }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => {});
  });
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
}
fetch('issues.json?_=' + Date.now()).then(r => { if (!r.ok) throw 0; return r.json(); }).then(list => {
  list.reverse(); // 최신 발행이 맨 앞
  render(list, new URLSearchParams(location.search).get('id') || '');
}).catch(() => { $('main').innerHTML = '<div class="err">소식을 불러오지 못했어요. 페이지를 새로 고쳐 주세요.</div>'; });
</script>
</body>
</html>
