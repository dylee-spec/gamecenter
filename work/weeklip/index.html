<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위클립 | 이번 주 숏폼 트렌드와 기획 아이디어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--blue:#3182F6;--blue-dark:#1B64DA;--blue-bg:#E8F3FF;--blue-soft:#D6E6FF;--g50:#F9FAFB;--g100:#F2F4F6;--g200:#E5E8EB;--g400:#B0B8C1;--g500:#8B95A1;--g600:#6B7684;--g700:#4E5968;--g800:#333D4B;--g900:#191F28;--orange:#E26A00;--orange-bg:#FFF3E0;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--g900);background:var(--g100);letter-spacing:-0.02em;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{width:min(1080px,100% - 48px);margin:0 auto}
.col{width:min(760px,100% - 48px);margin:0 auto}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--g100)}
.nav .wrap{height:72px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;font-style:normal;font-size:15px;font-weight:800;display:grid;place-items:center}
.menu{display:flex;align-items:center;gap:28px}
.menu a{font-size:15px;font-weight:500;color:var(--g700)}
.menu a:hover,.menu a[aria-current="page"]{color:var(--g900)}
.home-link{background:var(--g100);color:var(--g700)!important;font-size:14px!important;font-weight:700!important;padding:9px 16px;border-radius:10px}
.home-link:hover{background:var(--g200)}
.view{animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* home */
.hero{background:#fff;padding:88px 0 72px}
.eyebrow{font-size:16px;font-weight:700;color:var(--blue)}
.hero h1{font-size:52px;line-height:1.3;margin:16px 0;letter-spacing:-0.03em}
.lead{font-size:19px;color:var(--g600);line-height:1.5}
.latest{margin-top:48px;background:var(--blue);border-radius:28px;padding:44px 48px;display:grid;grid-template-columns:1fr 440px;gap:48px;align-items:center;color:#fff}
.pill{display:inline-block;background:#fff;color:var(--blue);font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px}
.latest h2{font-size:40px;margin:14px 0}
.latest .meta{color:var(--blue-soft);font-size:16px}
.latest .go-btn{display:inline-block;margin-top:28px;background:#fff;color:var(--blue-dark);font-weight:700;font-size:16px;padding:14px 22px;border-radius:14px;transition:background .15s}
.latest .go-btn:hover{background:var(--blue-bg)}
.preview{display:flex;flex-direction:column;gap:10px}
.preview a{background:#fff;color:var(--g900);border-radius:16px;padding:16px 20px;display:flex;gap:10px;align-items:center;font-weight:700;transition:transform .15s var(--ease)}
.preview a:hover{transform:translateX(4px)}
.num{color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}
.preview small{color:var(--blue-soft);font-size:14px}
.section{padding:80px 0 96px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.sec-head h2{font-size:30px;line-height:1.3}
.sec-head p{color:var(--g600);font-size:16px;margin-top:8px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 16px;width:320px;height:48px;border:2px solid transparent}
.search:focus-within{border-color:var(--blue)}
.search input{border:0;outline:0;background:none;width:100%;font-size:15px}
.rows{display:flex;flex-direction:column;gap:12px}
.row{background:#fff;border-radius:20px;padding:24px 28px;display:grid;grid-template-columns:220px 1fr auto;gap:32px;align-items:center;transition:background .15s}
.row:hover{background:var(--g50)}
.row b{display:block;font-size:19px}
.row small{display:block;margin-top:6px;color:var(--g500);font-size:14px}
.row .tags{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;font-size:13px;font-weight:500;padding:5px 10px;border-radius:8px;background:var(--g100);color:var(--g700);white-space:nowrap}
.go{color:var(--g500);font-size:15px}
.row:hover .go{color:var(--blue)}
.empty{background:#fff;border-radius:20px;padding:40px;text-align:center;color:var(--g600)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rule{background:#fff;border-radius:20px;padding:24px}
.rule b{font-size:17px}
.rule p{margin-top:8px;color:var(--g700);font-size:15px;line-height:1.6}
.method{background:#fff}
.method .rule{background:var(--g50)}
/* article */
.article{background:#fff;padding:48px 0 32px}
.back{color:var(--g600);font-size:15px;font-weight:500}
.back:hover{color:var(--g900)}
.issue-meta{margin-top:36px;font-size:15px;color:var(--g500)}
.issue-meta b{color:var(--blue)}
.article h1{font-size:40px;line-height:1.35;margin:16px 0 28px}
.intro{font-size:18px;line-height:1.85;color:var(--g800)}
.toc{margin:32px 0 8px;padding:24px 28px;background:var(--g50);border-radius:20px}
.toc b{font-size:14px;color:var(--g600)}
.toc ol{list-style:none;margin-top:12px;display:grid;gap:8px}
.toc a{display:flex;gap:10px;font-size:16px;font-weight:600;color:var(--g800)}
.toc a:hover{color:var(--blue)}
.post{padding:72px 0 8px;border-top:1px solid var(--g100);margin-top:56px;scroll-margin-top:80px}
.post:first-of-type{margin-top:40px}
.post-head{display:flex;gap:16px;align-items:baseline}
.post-head .no{font-size:28px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
.post-head h2{font-size:30px;line-height:1.35}
.post .tag-line{margin-top:12px;font-size:14px;color:var(--g500)}
.figure{margin:28px 0 8px}
.figure a{display:block;position:relative;border-radius:20px;overflow:hidden;background:var(--g100);aspect-ratio:16/9}
.figure img{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.figure a:hover img{transform:scale(1.03)}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{width:64px;height:64px;border-radius:50%;background:rgba(25,31,40,.72);display:grid;place-items:center}
.figure figcaption{margin-top:10px;font-size:13px;color:var(--g500)}
.post p.body{font-size:17px;line-height:1.9;color:var(--g800);margin-top:20px}
.post p.body b{color:var(--g900)}
.suggest{margin-top:28px;padding:24px 28px;border-radius:20px;background:var(--blue-bg)}
.suggest b{display:block;font-size:15px;color:var(--blue-dark)}
.suggest p{margin-top:8px;font-size:16px;line-height:1.8;color:var(--g800)}
.suggest small{display:block;margin-top:10px;font-size:13px;color:var(--g600)}
.refs{margin-top:28px}
.refs>b{font-size:15px}
.ref-list{display:grid;gap:10px;margin-top:12px}
.ref{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:10px;border-radius:16px;border:1px solid var(--g200);transition:background .15s,border-color .15s}
.ref:hover{background:var(--g50);border-color:var(--blue-soft)}
.ref img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--g100)}
.ref strong{display:block;font-size:15px;color:var(--g900)}
.ref span.cap{display:block;font-size:14px;color:var(--g600);margin-top:2px}
.ref .k{font-size:12px;font-weight:700;color:var(--g500);margin-right:6px}
.ref .arrow{font-size:14px;color:var(--g500);padding-right:8px}
.ref:hover .arrow{color:var(--blue)}
.srcs{margin-top:16px;font-size:13px;color:var(--g500)}
.data-line{margin-top:16px;display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--g50);border-radius:16px}.data-line b{display:block;font-size:17px;color:var(--blue-dark)}.data-line span{display:block;font-size:13px;color:var(--g500);margin-top:2px}.spark{flex:none}
.srcs a{text-decoration:underline;text-underline-offset:2px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px auto 80px}
.pager a,.pager div{background:#fff;border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.pager a:hover{background:var(--g50)}
.pager span{font-size:14px;color:var(--g500)}
.pager b{font-size:18px}
.pager .next{align-items:flex-end;text-align:right}
.pager div b{color:var(--g400)}
footer{background:var(--g50);padding:48px 0 64px;color:var(--g500);font-size:14px;line-height:1.6}
footer b{color:var(--g700);font-size:16px;display:block;margin-bottom:10px}
@media (max-width:860px){
 .menu a:not(.home-link){display:none}
 .hero h1{font-size:36px}.latest{grid-template-columns:1fr;padding:32px 24px}
 .row{grid-template-columns:1fr;gap:12px}.go{display:none}.search{width:100%}
 .rules,.pager{grid-template-columns:1fr}.article h1{font-size:30px}.post-head h2{font-size:24px}
 .ref{grid-template-columns:96px 1fr}.ref img{width:96px}.ref .arrow{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="logo" href="#/"><i>W</i>위클립</a>
  <nav class="menu" aria-label="주요 메뉴">
    <a href="#/latest" data-nav="latest">이번 주 트렌드</a>
    <a href="#/archive" data-nav="archive">지난 호</a>
    <a href="#/method" data-nav="method">선정 기준</a>
    <a class="home-link" href="../../index.html#work">게임센터로</a>
  </nav>
</div></header>
<main id="app"></main>
<script>
/* 위클립 데이터 원칙
   1) 출처에 기록된 트렌드만 싣는다. 출처가 월 단위뿐이면 주차로 쪼개지 않고 결산호로 묶는다.
   2) 참고 영상은 실제 재생 가능 여부를 확인한 것만 싣는다. (2026-09-23 확인)
   3) '위클립 제안'은 편집부 아이디어로, 사실 정보와 구분해 표시한다. */
let ISSUES=[];
const nextMonday=()=>{const n=new Date(Date.now()+9*3600e3);const w=(n.getUTCDay()+6)%7;const m=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+(7-w)));return `${m.getUTCMonth()+1}월 ${m.getUTCDate()}일 월요일`};
const NEXT_ISSUE=nextMonday();
const spark=s=>{if(!s||s.length<2)return'';const W=160,H=40,mx=Math.max(...s.map(x=>x.ratio))||1;const pts=s.map((x,i)=>`${(i/(s.length-1)*W).toFixed(1)},${(H-2-x.ratio/mx*(H-6)).toFixed(1)}`).join(' ');const last=pts.split(' ').pop().split(',');return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--blue)"/></svg>`};

const pad=n=>String(n).padStart(2,'0');
const latest=()=>ISSUES[ISSUES.length-1];
const byId=id=>ISSUES.find(i=>i.id===id);
const thumb=id=>`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
const watch=id=>`https://www.youtube.com/watch?v=${id}`;
const refCount=is=>is.trends.reduce((n,t)=>n+t.refs.length,0);
const app=document.getElementById('app');
const setNav=k=>document.querySelectorAll('[data-nav]').forEach(a=>a.dataset.nav===k?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
const methodHTML=()=>`<section class="section method" id="method"><div class="wrap">
    <div class="sec-head"><div><h2>트렌드를 고르는 기준</h2><p>위클립은 매주 같은 규칙으로 뷰티 트렌드를 골라요.</p></div></div>
    <div class="rules">
      <div class="rule"><b>검색 데이터가 올랐는가</b><p>네이버 데이터랩 공식 API로 뷰티 키워드의 주간 검색 추이를 확인해요. 지난주 검색량이 직전 4주 평균보다 30% 이상 오른 키워드만 후보가 돼요.</p></div>
      <div class="rule"><b>실제 영상이 있는가</b><p>유튜브 공식 API로 최근 7일 안에 올라온 공개 쇼츠를 찾아요. 조회수 상위 영상이 2개 이상 있어야 실어요.</p></div>
      <div class="rule"><b>사람이 확인했는가</b><p>초안은 자동으로 만들지만, 데이터에 없는 숫자나 과장된 효능 표현이 없는지 담당자가 검수한 뒤에만 발행해요.</p></div>
    </div></div></section>`;
const footer=()=>`<footer><div class="wrap"><b>위클립</b><p>매주 월요일, 데이터로 확인한 뷰티 트렌드와 기획 아이디어를 전해드려요.</p><p>트렌드 설명은 출처를 바탕으로 위클립이 다시 쓴 글이며, 영상과 이미지의 권리는 각 게시자에게 있어요.</p></div></footer>`;

function renderHome(){
  const L=latest(), past=[...ISSUES].reverse().slice(1);
  if(!L){app.innerHTML=`<div class="view"><section class="hero"><div class="wrap"><p class="eyebrow">뷰티 마케터를 위한 주간 트렌드</p><h1>이번 주 뷰티 트렌드<br>위클립이 알려드릴게요</h1><p class="lead">검색 데이터로 고르고, 실제 영상으로 확인하고, 바로 쓸 기획까지.</p><div class="latest"><div><span class="pill">첫 호 준비 중</span><h2>${NEXT_ISSUE}</h2><p class="meta">첫 뷰티 주간호가 이날 오전 9시에 발행돼요.</p></div></div></div></section>${methodHTML()}${footer()}</div>`;return}
  app.innerHTML=`<div class="view">
  <section class="hero"><div class="wrap">
    <p class="eyebrow">뷰티 마케터를 위한 주간 트렌드 · 매주 월요일 오전 9시</p>
    <h1>이번 주 뷰티 트렌드<br>위클립이 알려드릴게요</h1>
    <p class="lead">검색 데이터로 고르고, 실제 영상으로 확인하고, 바로 쓸 기획까지.</p>
    <div class="latest">
      <div><span class="pill">이번 주 최신호</span><h2>${L.label}</h2>
        <p class="meta">${L.range} · 트렌드 ${L.trends.length}개 · 참고 영상 ${refCount(L)}개</p>
        <a class="go-btn" href="#/issue/${L.id}">이번 주 트렌드 읽기 →</a></div>
      <div class="preview">${L.trends.slice(0,3).map((t,i)=>`<a href="#/issue/${L.id}/${i+1}"><span class="num">${pad(i+1)}</span>${t.t}</a>`).join('')}<small>외 ${L.trends.length-3}개 트렌드</small></div>
    </div>
  </div></section>
  <section class="section" id="archive"><div class="wrap">
    <div class="sec-head"><div><h2>지난 호 모아보기</h2><p>지나간 트렌드도 다시 꺼내 볼 수 있어요.</p></div>
      <label class="search"><input id="q" type="search" placeholder="키워드로 지난 트렌드 찾기" aria-label="지난 트렌드 검색"></label></div>
    <div class="rows">${past.map(is=>`<a class="row" href="#/issue/${is.id}" data-s="${is.trends.map(t=>t.t+' '+t.ind).join(' ').toLowerCase()}">
      <span><b>${is.label}</b><small>${is.range} · 트렌드 ${is.trends.length}개</small></span>
      <span class="tags">${is.trends.slice(0,3).map(t=>`<span class="chip">${t.keyword||t.t}</span>`).join('')}</span><span class="go">읽기 ›</span></a>`).join('')}</div>
    <div class="empty" id="none" hidden>검색 결과가 없어요. 다른 키워드로 찾아보세요.</div>
  </div></section>
  ${methodHTML()}
  ${footer()}</div>`;
  const q=document.getElementById('q');
  q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();let n=0;document.querySelectorAll('.row').forEach(r=>{const ok=!v||r.dataset.s.includes(v);r.hidden=!ok;if(ok)n++});document.getElementById('none').hidden=n>0});
}

function renderIssue(id,idx){
  const is=byId(id); if(!is){location.hash='#/';return}
  const i=ISSUES.indexOf(is), prev=ISSUES[i-1], next=ISSUES[i+1];
  app.innerHTML=`<div class="view"><article class="article"><div class="col">
    <a class="back" href="#/archive">← 전체 호 보기</a>
    <p class="issue-meta"><b>${is.label}</b> · ${is.range} · ${is.pub}</p>
    <h1>${is.headline.replace(/\n/g,'<br>')}</h1>
    <p class="intro">${is.intro}</p>
    <nav class="toc" aria-label="이번 호 목차"><b>이번 호에서 다룬 트렌드</b><ol>${is.trends.map((t,k)=>`<li><a href="#/issue/${is.id}/${k+1}"><span class="num">${pad(k+1)}</span>${t.t}</a></li>`).join('')}</ol></nav>
    ${is.trends.map((t,k)=>{const f=t.refs[0];return `<section class="post" id="t${k+1}">
      <div class="post-head"><span class="no">${pad(k+1)}</span><h2>${t.t}</h2></div>
      <div class="data-line">${spark(t.series)}<div><b>직전 4주 평균 대비 ${t.growthPct>=0?"+":""}${t.growthPct}%</b><span>네이버 검색 추이 · 지난주(${is.dataRange}) 기준</span></div></div>
      <figure class="figure"><a href="${watch(f.id)}" target="_blank" rel="noopener noreferrer" aria-label="${f.ch} 영상 보기"><img src="${thumb(f.id)}" alt="${t.t} 관련 영상 썸네일" loading="lazy"><span class="play"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span></span></a>
        <figcaption>이미지 출처 유튜브 채널 '${f.ch}'</figcaption></figure>
      ${t.body.map(p=>`<p class="body">${p}</p>`).join('')}
      ${t.idea&&!t.idea.startsWith("(")?`<div class="suggest"><b>이렇게 활용해 보세요</b><p>${t.idea}</p><small>위클립 편집부의 제안이에요.</small></div>`:""}
      <div class="refs"><b>직접 보고 참고하세요</b><div class="ref-list">${t.refs.map(r=>`<a class="ref" href="${watch(r.id)}" target="_blank" rel="noopener noreferrer"><img src="${thumb(r.id)}" alt="" loading="lazy"><span><strong>${r.ch}</strong><span class="cap">${r.title}</span><span class="cap">조회수 ${r.views.toLocaleString("ko-KR")}회 · ${r.published} 게시</span></span><span class="arrow">↗</span></a>`).join('')}</div></div>
      <p class="srcs">출처 · ${t.src.map(s=>`<a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.name}</a>`).join(' · ')}</p>
    </section>`}).join('')}
  </div></article>
  <div class="col"><nav class="pager" aria-label="호 이동">
    ${prev?`<a href="#/issue/${prev.id}"><span>← 이전 호</span><b>${prev.label}</b></a>`:`<div><span>← 이전 호</span><b>첫 번째 호예요</b></div>`}
    ${next?`<a class="next" href="#/issue/${next.id}"><span>다음 호 →</span><b>${next.label}</b></a>`:`<div class="next"><span>다음 호 →</span><b>${NEXT_ISSUE}에 공개돼요</b></div>`}
  </nav></div>${footer()}</div>`;
  if(idx){const el=document.getElementById('t'+idx);if(el)requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth'}))}else window.scrollTo(0,0);
}

function route(){
  const [a,b,c]=location.hash.replace(/^#\/?/,'').split('/');
  if(a==='issue'){setNav(latest()&&b===latest().id?'latest':'archive');renderIssue(b,c?+c:null);return}
  if(a==='latest'){if(latest())location.replace('#/issue/'+latest().id);else location.replace('#/');return}
  const onHome=!!document.getElementById('archive');
  if(!onHome)renderHome();
  setNav(['archive','method'].includes(a)?a:'');
  if(['archive','method'].includes(a))requestAnimationFrame(()=>{const el=document.getElementById(a);if(el)window.scrollTo({top:el.offsetTop-72,behavior:onHome?'smooth':'auto'})});
  else window.scrollTo({top:0,behavior:onHome?'smooth':'auto'});
}
addEventListener('hashchange',route);
fetch('issues.json?'+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[]).then(d=>{ISSUES=Array.isArray(d)?d:[];route()});
</script>
</body>
</html>
