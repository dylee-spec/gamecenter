<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위클립 | 이번 주 숏폼 트렌드와 기획 아이디어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--blue:#3182F6;--blue-dark:#1B64DA;--blue-bg:#E8F3FF;--blue-soft:#D6E6FF;--g50:#F9FAFB;--g100:#F2F4F6;--g200:#E5E8EB;--g400:#B0B8C1;--g500:#8B95A1;--g600:#6B7684;--g700:#4E5968;--g800:#333D4B;--g900:#191F28;--orange:#E26A00;--orange-bg:#FFF3E0;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--g900);background:var(--g100);letter-spacing:-0.02em;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{width:min(1080px,100% - 48px);margin:0 auto}
.col{width:min(760px,100% - 48px);margin:0 auto}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--g100)}
.nav .wrap{height:72px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;font-style:normal;font-size:15px;font-weight:800;display:grid;place-items:center}

.view{animation:enter .35s var(--ease)}

/* home */

.srcs{margin-top:16px;font-size:13px;color:var(--g500)}
.data-line{margin-top:16px;display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--g50);border-radius:16px}.data-line b{display:block;font-size:17px;color:var(--blue-dark)}.data-line span{display:block;font-size:13px;color:var(--g500);margin-top:2px}.spark{flex:none}
.cases-head{margin-top:72px;padding-top:56px;border-top:1px solid var(--g100)}.cases-head h2{font-size:30px}.cases-head p{margin-top:8px;color:var(--g600);font-size:16px;line-height:1.6}.case{margin-top:40px}.case-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.plat{font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--g100);color:var(--g700)}.plat.ig,.plat.reels{background:#FCE8F3;color:#C2186B}.plat.tt{background:var(--g900);color:#fff}.plat.yt{background:#FFEBEE;color:#D32F2F}.case h3{font-size:22px;line-height:1.4;margin-top:12px}.case .links{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.case .links a{font-size:14px;font-weight:600;padding:10px 14px;border-radius:12px;border:1px solid var(--g200)}.case .links a:hover{background:var(--g50);border-color:var(--blue-soft)}
.dchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.dchip{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--g100);color:var(--g700)}.dchip b{color:var(--g900)}.dchip.season{background:var(--orange-bg);color:var(--orange)}.dchip.new{background:var(--blue-bg);color:var(--blue-dark)}
.clients{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.client{border:1px solid var(--g200);border-radius:20px;padding:20px}.client-top{display:flex;justify-content:space-between;align-items:center}.client-top b{font-size:18px}.client-top .up{color:var(--blue-dark);font-weight:700}.client-top .down{color:var(--g600);font-weight:700}.client-top .na{color:var(--g400);font-size:13px}.client>p{margin-top:6px;font-size:13px;color:var(--g600)}.client a{display:grid;grid-template-columns:96px 1fr;gap:12px;margin-top:12px;align-items:center}.client a img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--g100)}.client a strong{display:block;font-size:14px}.client a span span{display:block;font-size:13px;color:var(--g600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.client .none{font-size:13px;color:var(--g400);margin-top:12px}
@media (max-width:860px){.clients{grid-template-columns:1fr}}
.steps{margin:16px 0 0 20px;display:grid;gap:6px;font-size:16px;line-height:1.7;color:var(--g800)}.ref-ph{width:120px;aspect-ratio:16/9;border-radius:10px;background:var(--g100);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--g600)}
.client-prose p.body,.client-intro{font-size:17px;line-height:1.9;color:var(--g800);margin-top:18px}.client-prose a{color:var(--blue-dark);text-decoration:underline;text-underline-offset:2px}
.srcs a{text-decoration:underline;text-underline-offset:2px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px auto 80px}
.pager a,.pager div{background:#fff;border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.pager a:hover{background:var(--g50)}
.pager span{font-size:14px;color:var(--g500)}
.pager b{font-size:18px}
.pager .next{align-items:flex-end;text-align:right}
.pager div b{color:var(--g400)}
footer{background:var(--g50);padding:48px 0 64px;color:var(--g500);font-size:14px;line-height:1.6}
footer b{color:var(--g700);font-size:16px;display:block;margin-bottom:10px}
@media (max-width:860px){
 .menu a:not(.home-link){display:none}
 .hero h1{font-size:36px}.latest{grid-template-columns:1fr;padding:32px 24px}

 .rules,.pager{grid-template-columns:1fr}.article h1{font-size:30px}.post-head h2{font-size:24px}
 .ref{grid-template-columns:96px 1fr}.ref img{width:96px}.ref .arrow{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.why>b{display:block;font-size:14px;color:var(--g900)}.why p b{color:var(--g900)}

.mono.logo{background:#fff!important;border:1px solid var(--g200);padding:6px}
.mono.logo img{width:100%;height:100%;object-fit:contain}
.cissues{margin-top:16px;padding-top:14px;border-top:1px solid var(--g100)}

.cissues ul{list-style:none;margin-top:8px;display:grid;gap:8px}
.cissues li{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:8px;align-items:start;font-size:15px;line-height:1.7;color:var(--g800)}
.cissues .tone{display:inline-block;align-self:start;font-size:11px;font-weight:700;line-height:1.5;padding:1px 7px;border-radius:6px;margin-top:3px;white-space:nowrap}
.tone.good{background:#E8F8EE;color:#0E8A4B}.tone.bad{background:#FFEBEE;color:#E42939}.tone.info{background:var(--g100);color:var(--g600)}
.cissues a{color:var(--g500);font-size:13px;text-decoration:underline;text-underline-offset:2px;margin-left:4px}

.intro-box{background:var(--g50);border-radius:24px;padding:28px 32px;margin-top:8px}
.intro-box .label{display:block;font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px}
.intro-box .intro{font-size:17px}
.toc{margin-bottom:0}
.sec-title{margin-top:120px;padding-top:40px;border-top:2px solid var(--g900)}
.sec-title small{display:block;font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.02em}
.sec-title h2{font-size:30px;line-height:1.35;margin-top:8px}
.sec-title p{margin-top:10px;color:var(--g600);font-size:16px;line-height:1.7}
.post:first-of-type{margin-top:24px}
.why{margin-top:22px;padding:20px 24px;border-radius:18px;border:1px solid var(--g200);background:#fff}.why b{font-size:15px;color:var(--g900)}.why p{margin-top:8px;font-size:16px;line-height:1.8;color:var(--g700)}
.ideas{list-style:none;display:grid;gap:14px;margin-top:10px}
.ideas li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.ideas .itype{font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:#fff;color:var(--blue-dark);white-space:nowrap;margin-top:3px}

.fmt{margin-top:0;padding:64px 0 16px}
.fmt+.fmt{margin-top:56px;border-top:1px dashed var(--g200)}
.fmt .fnum{font-size:14px;font-weight:800;color:var(--blue);display:block;margin-top:14px}
.clients-list{display:grid;gap:14px;margin-top:28px}

.ccard p.ctext{margin-top:14px;font-size:16px;line-height:1.8;color:var(--g800)}

<body>
<header class="nav"><div class="wrap">
  <a class="logo" href="#/"><i>W</i>위클립</a>
  <nav class="menu" aria-label="주요 메뉴">
    <a href="#/latest" data-nav="latest">이번 주 트렌드</a>
    <a href="#/archive" data-nav="archive">지난 호</a>
    <a href="#/method" data-nav="method">선정 기준</a>
    <a class="home-link" href="../../index.html#work">게임센터로</a>
  </nav>
</div></header>
<main id="app"></main>
<script>
/* 위클립 데이터 원칙
   1) 출처에 기록된 트렌드만 싣는다. 출처가 월 단위뿐이면 주차로 쪼개지 않고 결산호로 묶는다.
   2) 참고 영상은 실제 재생 가능 여부를 확인한 것만 싣는다. (2026-09-23 확인)
   3) '위클립 제안'은 편집부 아이디어로, 사실 정보와 구분해 표시한다. */
let ISSUES=[];
const ideasHTML=(list,title,one)=>{if(list&&list.length)return `<div class="suggest"><b>${title}</b><ul class="ideas">${list.map(x=>`<li><span class="itype">${x.type}</span><p>${x.text}</p></li>`).join('')}</ul><small>위클립 편집부의 제안이에요.</small></div>`;if(one&&!one.startsWith('('))return `<div class="suggest"><b>${title}</b><p>${one}</p><small>위클립 편집부의 제안이에요.</small></div>`;return ''};
const nextMonday=()=>{const n=new Date(Date.now()+9*3600e3);const w=(n.getUTCDay()+6)%7;const m=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+(7-w)));return `${m.getUTCMonth()+1}월 ${m.getUTCDate()}일 월요일`};
const NEXT_ISSUE=nextMonday();
const sgn=n=>(n>=0?'+':'')+n+'%';
const dataChips=t=>{const c=[];
  if(t.yoyPct!=null)c.push(`<span class="dchip">작년 같은 주 대비 <b>${sgn(t.yoyPct)}</b></span>`);
  if(t.lastYearGrowthPct!=null)c.push(t.seasonal?`<span class="dchip season">작년 이맘때도 상승 (계절성)</span>`:`<span class="dchip new">올해 새로 뜬 흐름</span>`);
  if(t.clickGrowthPct!=null)c.push(`<span class="dchip">쇼핑 클릭 <b>${sgn(t.clickGrowthPct)}</b></span>`);
  if(t.demo&&t.demo.femalePct!=null)c.push(`<span class="dchip">쇼핑 클릭 여성 <b>${t.demo.femalePct}%</b></span>`);
  if(t.blog7)c.push(`<span class="dchip">지난주 네이버 블로그 <b>${t.blog7.count}건${t.blog7.capped?' 이상':''}</b></span>`);
  if(t.demo&&t.demo.topAge)c.push(`<span class="dchip">최다 연령 <b>${t.demo.topAge} ${t.demo.topAgePct}%</b></span>`);
  return c.length?`<div class="dchips">${c.join('')}</div>`:''};
const ytId=u=>{const m=(u||'').match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/);return m?m[1]:null};
const formatsHTML=is=>!(is.formats&&is.formats.length)?'':`<div class="sec-title"><small>PART 2</small><h2>이번 주 유행 포맷</h2><p>업종과 상관없이 요즘 릴스·틱톡·쇼츠에서 많이 쓰이는 영상 구성과 챌린지예요. 뷰티 브랜드라면 어떻게 가져올 수 있을지도 함께 적었어요.</p></div>

const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1);return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b};

const MONO=['#3182F6','#F04452','#00A661','#FE9800','#8B5CF6','#0EA5E9','#E4405F','#14B8A6','#6366F1','#D97706','#DB2777','#475569'];

const spark=s=>{if(!s||s.length<2)return'';const W=160,H=40,mx=Math.max(...s.map(x=>x.ratio))||1;const pts=s.map((x,i)=>`${(i/(s.length-1)*W).toFixed(1)},${(H-2-x.ratio/mx*(H-6)).toFixed(1)}`).join(' ');const last=pts.split(' ').pop().split(',');return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--blue)"/></svg>`};

    ${(is.cases&&is.cases.length)?`<div class="sec-title"><small>PART 3</small><h2>이번 주 브랜드 사례</h2><p>${is.cases[0].mode==='news'?'지난주 보도된 기사 중 뷰티 브랜드의 인스타그램·릴스·틱톡·유튜브 활용 소식을 모았어요. 요약은 기사 원문 일부이니 자세한 내용은 원문에서 확인하세요.':'지난주 기사와 공개 자료에 소개된 뷰티 브랜드의 인스타그램·릴스·틱톡·유튜브 활용 사례예요. 출처에 적힌 내용만 옮겼어요.'}</p></div>
    ${is.cases.map(c=>{const k=/릴스/.test(c.platform)?'reels':/인스타/.test(c.platform)?'ig':/틱톡/.test(c.platform)?'tt':/유튜브/.test(c.platform)?'yt':'';return `<section class="case"><div class="case-top"><span class="plat ${k}">${c.platform}</span>${c.brand?`<span class="chip">${c.brand}</span>`:""}</div>
      <h3>${c.title}</h3>${c.body.map(p=>`<p class="body">${p}</p>`).join('')}
      ${c.point?`<div class="suggest"><b>가져갈 포인트</b><p>${c.point}</p><small>위클립 편집부의 제안이에요.</small></div>`:''}
      <div class="links">${c.postUrl?`<a href="${c.postUrl}" target="_blank" rel="noopener noreferrer">원본 게시물 보기 ↗</a>`:''}<a href="${c.sourceUrl}" target="_blank" rel="noopener noreferrer">${c.mode==='news'?'기사 원문 보기':(c.sourceName||'출처')+' 기사 보기'} ↗</a></div>
      <p class="srcs">출처 · ${c.sourceName||''} ${c.sourceDate}</p></section>`}).join('')}`:''}
    ${clientsHTML(is)}
  </div></article>
  <div class="col"><nav class="pager" aria-label="호 이동">
    ${prev?`<a href="#/issue/${prev.id}"><span>← 이전 호</span><b>${prev.label}</b></a>`:`<div><span>← 이전 호</span><b>첫 번째 호예요</b></div>`}
    ${next?`<a class="next" href="#/issue/${next.id}"><span>다음 호 →</span><b>${next.label}</b></a>`:`<div class="next"><span>다음 호 →</span><b>${NEXT_ISSUE}에 공개돼요</b></div>`}
  </nav></div>${footer()}</div>`;
  if(idx){const el=document.getElementById('t'+idx);if(el)requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth'}))}else window.scrollTo(0,0);
}

function route(){
  const [a,b,c]=location.hash.replace(/^#\/?/,'').split('/');
  if(a==='issue'){setNav(latest()&&b===latest().id?'latest':'archive');renderIssue(b,c?+c:null);return}
  if(a==='latest'){if(latest())location.replace('#/issue/'+latest().id);else location.replace('#/');return}
  const onHome=!!document.getElementById('archive');
  if(!onHome)renderHome();
  setNav(['archive','method'].includes(a)?a:'');
  if(['archive','method'].includes(a))requestAnimationFrame(()=>{const el=document.getElementById(a);if(el)window.scrollTo({top:el.offsetTop-72,behavior:onHome?'smooth':'auto'})});
  else window.scrollTo({top:0,behavior:onHome?'smooth':'auto'});
}
addEventListener('hashchange',route);
fetch('issues.json?'+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[]).then(d=>{ISSUES=Array.isArray(d)?d:[];route()});
</script>
</body>
</html>
