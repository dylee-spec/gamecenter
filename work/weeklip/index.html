<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위클립 | 이번 주 숏폼 트렌드와 기획 아이디어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --blue:#3182F6; --blue-dark:#1B64DA; --blue-bg:#E8F3FF; --blue-soft:#D6E6FF;
  --g50:#F9FAFB; --g100:#F2F4F6; --g200:#E5E8EB; --g300:#D1D6DB; --g400:#B0B8C1;
  --g500:#8B95A1; --g600:#6B7684; --g700:#4E5968; --g800:#333D4B; --g900:#191F28;
  --orange:#E26A00; --orange-bg:#FFF3E0; --green:#0E8A4B; --green-bg:#E8F8EE; --red:#E42939; --red-bg:#FFEBEE;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--g900);background:var(--g100);letter-spacing:-0.02em;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{width:min(1080px,100% - 48px);margin:0 auto}
.narrow{width:min(880px,100% - 48px);margin:0 auto}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--g100)}
.nav .wrap{height:72px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;font-style:normal;font-size:15px;font-weight:800;display:grid;place-items:center}
.menu{display:flex;align-items:center;gap:32px}
.menu a{font-size:15px;font-weight:500;color:var(--g700);transition:color .15s}
.menu a:hover,.menu a[aria-current="page"]{color:var(--g900)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;font-weight:700;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.home-link{background:var(--g100);color:var(--g700)}
.home-link:hover{background:var(--g200)}
.btn-sm{font-size:14px;padding:9px 16px;border-radius:10px}

/* view transition */
#app{min-height:calc(100vh - 72px)}
.view{animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* hero */
.hero{background:#fff;padding:88px 0 80px}
.eyebrow{font-size:16px;font-weight:700;color:var(--blue)}
.hero h1{font-size:52px;line-height:1.3;font-weight:700;margin:16px 0;letter-spacing:-0.03em}
.hero p.lead{font-size:19px;color:var(--g600);line-height:1.5}
.latest{margin-top:48px;background:var(--blue);border-radius:28px;padding:44px 48px;display:grid;grid-template-columns:1fr 440px;gap:48px;align-items:center;color:#fff}
.pill{display:inline-block;background:#fff;color:var(--blue);font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px}
.latest h2{font-size:40px;font-weight:700;margin:14px 0}
.latest .meta{color:var(--blue-soft);font-size:16px}
.latest .btn{margin-top:28px;background:#fff;color:var(--blue-dark);font-size:16px;padding:14px 22px;border-radius:14px}
.latest .btn:hover{background:var(--blue-bg)}
.preview{display:flex;flex-direction:column;gap:10px}
.preview a{background:#fff;color:var(--g900);border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:transform .15s var(--ease)}
.preview a:hover{transform:translateX(4px)}
.preview .t{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px;min-width:0}
.preview .t span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{color:var(--blue);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.preview small{color:var(--blue-soft);font-size:14px;font-weight:500}

/* chips */
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:500;padding:5px 10px;border-radius:8px;background:var(--g100);color:var(--g700);white-space:nowrap}
.st-up{background:var(--blue-bg);color:var(--blue-dark)}
.st-peak{background:var(--orange-bg);color:var(--orange)}
.st-down{background:var(--g100);color:var(--g600)}
.au-ok{background:var(--green-bg);color:var(--green)}
.au-warn{background:var(--red-bg);color:var(--red)}

/* sections */
.section{padding:80px 0 96px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:40px;flex-wrap:wrap}
.sec-head h2{font-size:30px;font-weight:700;line-height:1.3}
.sec-head p{color:var(--g600);font-size:16px;margin-top:8px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 16px;width:320px;height:48px;border:2px solid transparent;transition:border-color .15s}
.search:focus-within{border-color:var(--blue)}
.search svg{flex:none;color:var(--g500)}
.search input{border:0;outline:0;background:none;width:100%;font-size:15px}
.search input::placeholder{color:var(--g400)}
.month{margin-bottom:40px}
.month h3{font-size:17px;font-weight:700;color:var(--g600);margin-bottom:12px}
.rows{display:flex;flex-direction:column;gap:12px}
.row{background:#fff;border-radius:20px;padding:24px 28px;display:grid;grid-template-columns:200px 1fr auto;gap:40px;align-items:center;transition:background .15s}
.row:hover{background:var(--g50)}
.row:hover .go{color:var(--blue)}
.row b{display:block;font-size:19px}
.row small{display:block;margin-top:6px;color:var(--g500);font-size:14px}
.row .tags{display:flex;gap:8px;flex-wrap:wrap}
.go{color:var(--g500);font-size:15px;font-weight:500;transition:color .15s}
.empty{background:#fff;border-radius:20px;padding:48px;text-align:center;color:var(--g600);line-height:1.6}
.empty b{display:block;color:var(--g900);font-size:18px;margin-bottom:6px}

/* custom */
.custom{background:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.seg button,.filters button{padding:10px 16px;border-radius:999px;background:var(--g100);color:var(--g700);font-size:14px;font-weight:500;transition:background .15s,color .15s}
.seg button:hover,.filters button:hover{background:var(--g200)}
.seg button[aria-pressed="true"],.filters button[aria-pressed="true"]{background:var(--g900);color:#fff;font-weight:700}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pick{background:var(--g50);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px;transition:background .15s}
.pick:hover{background:var(--g100)}
.pick .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pick small{color:var(--g500);font-size:13px;font-weight:500}
.pick b{font-size:18px}
.pick p{color:var(--g700);font-size:15px;line-height:1.55}

footer{background:var(--g50);padding:48px 0 64px;color:var(--g500);font-size:14px;line-height:1.6}
footer b{color:var(--g700);font-size:16px;display:block;margin-bottom:10px}
footer .links{margin-top:10px;color:var(--g400);font-size:13px;display:flex;gap:20px;flex-wrap:wrap}

/* detail */
.issue-head{background:#fff;padding:48px 0}
.back{color:var(--g600);font-size:15px;font-weight:500;display:inline-flex;gap:8px;padding:6px 0}
.back:hover{color:var(--g900)}
.issue-meta{margin-top:32px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--g500)}
.issue-meta b{color:var(--blue);font-size:16px}
.issue-head h1{font-size:40px;line-height:1.35;margin:20px 0}
.issue-head .summary{font-size:17px;color:var(--g700);line-height:1.65}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}
.stat{background:var(--g50);border-radius:16px;padding:18px 20px}
.stat span{display:block;font-size:14px;color:var(--g600);font-weight:500}
.stat b{display:block;font-size:24px;margin-top:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.trends{padding:40px 0 24px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border-radius:24px;padding:32px;scroll-margin-top:96px;transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 3px var(--blue)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:16px}
.card-head h3{display:flex;gap:12px;align-items:baseline;font-size:24px;line-height:1.3}
.card-head .num{font-size:17px}
.card.down h3 span:last-child{color:var(--g600)}
.card .desc{margin-top:16px;font-size:16px;line-height:1.6;color:var(--g700)}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.idea-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.card.open .idea-wrap{grid-template-rows:1fr}
.idea-wrap>div{overflow:hidden}
.idea{margin-top:16px;background:var(--g50);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.idea-top{display:flex;justify-content:space-between;align-items:center}
.idea-top b{color:var(--blue);font-size:14px}
.copy{font-size:13px;font-weight:600;color:var(--g600);background:#fff;border-radius:8px;padding:6px 10px;transition:color .15s}
.copy:hover{color:var(--blue)}
.idea dl{display:grid;grid-template-columns:88px 1fr;gap:12px 16px;font-size:15px;line-height:1.6}
.idea dt{font-weight:700;color:var(--g800)}
.idea dd{color:var(--g700)}
.toggle{margin-top:16px;font-size:14px;font-weight:600;color:var(--blue);display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.card.open .toggle{color:var(--g500)}
.toggle svg{transition:transform .3s var(--ease)}
.card.open .toggle svg{transform:rotate(180deg)}
.overseas{background:var(--g900);color:#fff;border-radius:24px;padding:32px;margin-top:8px}
.overseas h2{font-size:22px}
.overseas>p{color:var(--g500);font-size:15px;margin-top:8px}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.ov{background:var(--g800);border-radius:16px;padding:20px}
.ov small{color:#64A8FF;font-size:13px;font-weight:700}
.ov b{display:block;font-size:18px;margin:10px 0}
.ov p{color:var(--g400);font-size:14px;line-height:1.55}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px auto 80px}
.pager a,.pager div{background:#fff;border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:6px;transition:background .15s}
.pager a:hover{background:var(--g50)}
.pager span{font-size:14px;color:var(--g500);font-weight:500}
.pager b{font-size:18px}
.pager .next{align-items:flex-end;text-align:right}
.pager div b{color:var(--g400)}

/* refs */
.refs{margin-top:12px;border:1px solid var(--g200);border-radius:16px;padding:20px 24px}
.refs-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.refs-top b{font-size:14px;color:var(--g900)}
.refs-top small{font-size:13px;color:var(--g500)}
.ref-list{display:flex;flex-direction:column;gap:8px}
.ref{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--g50);transition:background .15s}
a.ref:hover{background:var(--blue-bg)}
a.ref:hover .ref-go{color:var(--blue)}
.plat{font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;text-align:center}
.p-reels{background:#FCE8F3;color:#C2186B}
.p-shorts{background:#FFEBEE;color:#D32F2F}
.p-tiktok{background:var(--g900);color:#fff}
.ref-body b{display:block;font-size:14px;color:var(--g800)}
.ref-body span{display:block;font-size:14px;color:var(--g600);line-height:1.5;margin-top:2px}
.ref-go{font-size:13px;font-weight:600;color:var(--g500);white-space:nowrap}
.ref.pending .ref-go{color:var(--g400)}

/* toast */
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--g900);color:#fff;padding:14px 22px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .menu a:not(.home-link){display:none}
  .hero h1{font-size:36px}
  .latest{grid-template-columns:1fr;padding:32px 24px}
  .row{grid-template-columns:1fr;gap:12px}
  .go{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .ov-grid,.pager{grid-template-columns:1fr}
  .issue-head h1{font-size:30px}
  .search{width:100%}
  .idea dl{grid-template-columns:1fr;gap:4px}
  .idea dd{margin-bottom:8px}
  .ref{grid-template-columns:1fr}
  .plat{justify-self:start}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="logo" href="#/"><i>W</i>위클립</a>
    <nav class="menu" aria-label="주요 메뉴">
      <a href="#/latest" data-nav="latest">이번 주 트렌드</a>
      <a href="#/archive" data-nav="archive">지난 호</a>
      <a href="#/custom" data-nav="custom">맞춤 기획</a>
      <a class="btn btn-sm home-link" href="../../index.html#work">게임센터로</a>
    </nav>
  </div>
</header>

<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   데이터 (예시)
   매주 월요일에 ISSUES 배열 맨 뒤에 새 호를 추가하면 됩니다.
   나중에 자동화할 때는 이 배열을 issues.json 파일로 분리해서 불러오면 돼요.
   audio: ok(상업용 음원 가능) / field(현장음만) / orig(오리지널 사운드 권장) / warn(브랜드 계정 사용 제한)
   f: solo(혼자 폰으로) / noface(얼굴 노출 없이) / product(제품만으로)
   stage: up(떠오르는 중) / peak(정점) / down(하락세)
   레퍼런스 게시물은 아래 REFS에 호 id별로, 트렌드 순서대로 넣어요.
     p: reels(인스타 릴스) / shorts(유튜브 쇼츠) / tiktok(틱톡)
     acc: 계정 이름, url: 게시물 주소(비워 두면 '링크 연결 전'으로 표시), note: 이 영상에서 볼 포인트
   ========================================================= */
const ISSUES = [
{
  start:'2026-08-03', week:1,
  headline:'장마가 끝나자\n시원함을 보여주는 영상이 늘었어요',
  summary:'음료나 빙수를 만드는 소리, 여름 코디처럼 보기만 해도 시원한 영상이 반응을 얻고 있어요. 휴가 공지도 재미있게 만들면 콘텐츠가 됩니다.',
  tags:['#음료 제조 ASMR','#여름 코디','#휴가 공지'],
  trends:[
    {t:'시원한 음료 제조 ASMR',s:'up',d:'얼음 소리, 따르는 소리처럼 현장음을 살려 음료 한 잔이 완성되는 과정을 보여줘요. 음성 없이도 끝까지 보게 되는 포맷이에요.',a:'field',lv:'난이도 쉬움 · 제품만으로',f:['solo','noface','product'],ind:'카페 · 디저트 · 음료',hook:'얼음이 컵에 떨어지는 소리로 첫 1초를 시작하기',scenes:'① 얼음 소리 클로즈업 → ② 재료 붓기 → ③ 섞는 소리 → ④ 완성 컷과 가격 자막',tip:'마이크를 컵 가까이 두고 배경 음악은 넣지 마세요.'},
    {t:'장마 끝 여름 코디 3벌',s:'up',d:'같은 아이템 하나로 세 가지 여름 코디를 빠르게 넘기는 영상이에요. 저장 수가 높게 나와 쇼핑몰에서 활용하기 좋아요.',a:'ok',lv:'난이도 보통 · 혼자 폰으로',f:['solo'],ind:'패션 쇼핑몰 · 소품샵',hook:'"반팔 하나로 일주일 버티기, 가능할까요?"',scenes:'① 기본 아이템 소개 → ② 코디 1·2·3 빠른 전환 → ③ 가장 반응 좋은 코디 투표',tip:'전신이 나오도록 삼각대를 허리 높이에 두면 핏이 잘 보여요.'},
    {t:'휴가 떠나는 가게 공지',s:'peak',d:'휴무 공지를 짧은 상황극으로 만든 영상이에요. 단골에게 소식을 알리면서 가게의 분위기까지 전할 수 있어요.',a:'orig',lv:'난이도 쉬움',f:['solo'],ind:'전 업종',hook:'셔터를 내리며 "사장님 이번 주는 바다 갑니다"',scenes:'① 셔터 내리는 장면 → ② 휴무 날짜 자막 → ③ 돌아오면 할 이벤트 예고',tip:'휴무 날짜는 크게, 화면 가운데에 3초 이상 보여주세요.'},
    {t:'하루 매출 공개 브이로그',s:'down',d:'하루 매출을 숫자로 공개하는 포맷이에요. 여전히 보이지만 비슷한 영상이 많아져 반응이 줄어드는 중이에요.',a:'ok',lv:'난이도 쉬움',f:['solo'],ind:'전 업종',hook:'"오늘 장사, 얼마 벌었을까요?"',scenes:'① 오픈 → ② 바빴던 순간 → ③ 마감 후 정산 화면',tip:'숫자보다 과정의 에피소드에 무게를 두면 차별화돼요.'}
  ],
  overseas:[{r:'미국 · 조회수 급상승',t:'얼음 컵 사운드 챌린지',d:'얼음 컵에 음료를 붓는 소리만 담은 초단편 영상이 늘고 있어요.'},{r:'일본 · 저장 수 급상승',t:'편의점 조합 레시피',d:'흔한 재료 두세 가지로 새 메뉴를 만드는 영상이에요.'}]
},
{
  start:'2026-08-10', week:2,
  headline:'여름 휴가철,\n브이로그와 한정 메뉴가 강세예요',
  summary:'휴가 브이로그 형식을 빌려 가게나 제품을 보여주는 영상이 늘었어요. 말복을 앞두고 여름 한정 메뉴를 알리는 영상도 반응이 좋아요.',

  const L=latest();
  const months={};
  [...ISSUES].reverse().slice(1).forEach(is=>{(months[`${is.y}년 ${is.m}월`] ||= []).push(is)});
  app.innerHTML=`<div class="view">
  <section class="hero"><div class="wrap">
    <p class="eyebrow">매주 월요일 아침 발행</p>
    <h1>이번 주 트렌드<br>위클립이 알려드릴게요</h1>
    <p class="lead">숏폼 트렌드 정리부터 바로 쓸 수 있는 기획 아이디어까지 한 번에.</p>
    <div class="latest">
      <div>
        <span class="pill">NEW · 이번 주 최신호</span>
        <h2>${L.label}</h2>
        <p class="meta">${L.range} · 트렌드 ${L.trends.length}개 · 기획 아이디어 ${L.trends.length*3}개</p>
        <a class="btn" href="#/issue/${L.id}">이번 주 트렌드 보기 →</a>
      </div>
      <div class="preview">
        ${L.trends.slice(0,3).map((t,i)=>`<a href="#/issue/${L.id}/${i+1}"><span class="t"><span class="num">${pad(i+1)}</span><span>${t.t}</span></span>${chip(STAGE[t.s][0],STAGE[t.s][1])}</a>`).join('')}
        <small>외 ${L.trends.length-3}개 트렌드</small>
      </div>
    </div>
  </div></section>

  <section class="section" id="archive"><div class="wrap">
    <div class="sec-head">
      <div><h2>지난 호 모아보기</h2><p>지나간 트렌드도 다시 꺼내 볼 수 있어요.</p></div>
      <label class="search">${icon.search}<input id="q" type="search" placeholder="키워드로 지난 트렌드 찾기" aria-label="지난 트렌드 검색"></label>
    </div>
    <div id="archiveList">
      ${Object.entries(months).map(([m,list])=>`<div class="month"><h3>${m}</h3><div class="rows">
        ${list.map(is=>`<a class="row" href="#/issue/${is.id}" data-search="${(is.tags.join(' ')+' '+is.trends.map(t=>t.t+' '+t.ind).join(' ')).toLowerCase()}">
          <span><b>${is.short}</b><small>${is.dots} · 트렌드 ${is.trends.length}개</small></span>
          <span class="tags">${is.tags.map(t=>chip(t)).join('')}</span>
          <span class="go">보기 ›</span></a>`).join('')}
      </div></div>`).join('')}
      <div class="empty" id="noResult" hidden><b>검색 결과가 없어요</b>다른 키워드로 찾아보세요. 예: 포장, 카페, 퀴즈</div>
    </div>
  </div></section>

  <section class="section custom" id="custom"><div class="wrap">
    <div class="sec-head"><div><h2>우리 업종에 맞는 기획 찾기</h2><p>최근 2주 트렌드 중 하락세를 뺀 기획만 골라 드려요.</p></div></div>
    <div class="seg" role="group" aria-label="업종 선택">
      ${Object.keys(INDUSTRY).map((k,i)=>`<button aria-pressed="${i===0}" data-ind="${k}">${k}</button>`).join('')}
    </div>
    <div class="picks" id="picks"></div>
  </div></section>

  ${footer()}
  </div>`;

  // archive search
  const q=document.getElementById('q');
  q.addEventListener('input',()=>{
    const v=q.value.trim().toLowerCase().replace(/^#/,'');
    let any=false;
    document.querySelectorAll('#archiveList .month').forEach(m=>{
      let vis=0;
      m.querySelectorAll('.row').forEach(r=>{const ok=!v||r.dataset.search.includes(v);r.hidden=!ok;if(ok)vis++});
      m.hidden=vis===0; if(vis)any=true;
    });
    document.getElementById('noResult').hidden=any;
  });

  // custom picks
  const renderPicks=key=>{
    const kws=INDUSTRY[key];
    const recent=ISSUES.slice(-2).reverse();
    const picks=[];
    recent.forEach(is=>is.trends.forEach((t,i)=>{
      if(t.s==='down')return;
      if(t.ind==='전 업종'||kws.some(k=>t.ind.includes(k)))picks.push({is,t,i});
    }));
    document.getElementById('picks').innerHTML=picks.length?picks.map(({is,t,i})=>`
      <a class="pick" href="#/issue/${is.id}/${i+1}">
        <span class="top"><small>${is.short}</small>${chip(STAGE[t.s][0],STAGE[t.s][1])}</span>
        <b>${t.t}</b><p>${t.hook}</p></a>`).join('')
      :`<div class="empty"><b>이번 주엔 맞는 기획이 없어요</b>지난 호 모아보기에서 업종 이름으로 검색해 보세요.</div>`;
  };
  document.querySelectorAll('[data-ind]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('[data-ind]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    renderPicks(b.dataset.ind);
  }));
  renderPicks(Object.keys(INDUSTRY)[0]);
}

/* ============ issue ============ */
function renderIssue(id,openIdx){
  const is=byId(id); if(!is){location.hash='#/';return}
  const idx=ISSUES.indexOf(is), prev=ISSUES[idx-1], next=ISSUES[idx+1];
  const cnt=k=>is.trends.filter(t=>t.s===k).length;
  app.innerHTML=`<div class="view">
  <section class="issue-head"><div class="narrow">
    <a class="back" href="#/archive">← 전체 호 보기</a>
    <p class="issue-meta"><b>${is.label}</b><span>· ${is.range} · ${is.pub}</span></p>
    <h1>${nl2br(is.headline)}</h1>
    <p class="summary">${is.summary}</p>
    <div class="stats">
      <div class="stat"><span>이번 주 트렌드</span><b>${is.trends.length}개</b></div>
      <div class="stat"><span>떠오르는 중</span><b style="color:var(--blue-dark)">${cnt('up')}개</b></div>
      <div class="stat"><span>정점</span><b style="color:var(--orange)">${cnt('peak')}개</b></div>
      <div class="stat"><span>하락세</span><b style="color:var(--g600)">${cnt('down')}개</b></div>
    </div>
    <div class="filters" role="group" aria-label="촬영 조건 필터">
      ${FILTERS.map(([k,l],i)=>`<button data-f="${k}" aria-pressed="${i===0}">${l}</button>`).join('')}
    </div>
  </div></section>

  <div class="narrow">
    <div class="trends" id="trends">
      ${is.trends.map((t,i)=>{
        const au=AUDIO[t.a], f=[...t.f, ...(t.a==='ok'||t.a==='field'?['music']:[])];
        return `<article class="card ${t.s==='down'?'down':''}" id="t${i+1}" data-f="${f.join(' ')}">
          <div class="card-head"><h3><span class="num">${pad(i+1)}</span><span>${t.t}</span></h3>${chip(STAGE[t.s][0],STAGE[t.s][1])}</div>
          <p class="desc">${t.d}</p>
          <div class="meta">${chip(au[0],au[1])}${chip(t.lv)}${chip(t.ind)}</div>
          <div class="idea-wrap" id="idea${i+1}"><div><div class="idea">
            <div class="idea-top"><b>기획 아이디어</b><button class="copy" data-copy="${i}">훅 복사</button></div>
            <dl><dt>첫 3초 훅</dt><dd>${t.hook}</dd><dt>장면 구성</dt><dd>${t.scenes}</dd><dt>촬영 팁</dt><dd>${t.tip}</dd></dl>
          </div>
          <div class="refs">
            <div class="refs-top"><b>이 트렌드를 고른 대표 게시물 ${t.refs.length}개</b><small>원본은 각 플랫폼에서 열려요</small></div>
            <div class="ref-list">${t.refs.map((r,j)=>{
              const pl=PLAT[r.p];
              const body=`<span class="plat ${pl[1]}">${pl[0]}</span><span class="ref-body"><b>${r.acc||'대표 게시물 '+(j+1)}</b><span>볼 포인트: ${r.note}</span></span>`;
              return r.url
                ?`<a class="ref" href="${r.url}" target="_blank" rel="noopener noreferrer">${body}<span class="ref-go">게시물 보기 ↗</span></a>`
                :`<div class="ref pending">${body}<span class="ref-go">링크 연결 전</span></div>`;
            }).join('')}</div>
          </div></div></div>
          <button class="toggle" aria-expanded="false" aria-controls="idea${i+1}"><span>기획 아이디어와 레퍼런스 보기</span>${icon.chevron}</button>
        </article>`}).join('')}
      <div class="empty" id="noTrend" hidden><b>이 조건에 맞는 트렌드가 없어요</b>필터를 하나 풀거나 ‘전체’를 눌러 보세요.</div>
    </div>

    <section class="overseas">
      <h2>다음 주 한국에 올 해외 트렌드</h2>
      <p>해외에서 먼저 뜨고 1~2주 뒤 국내로 넘어올 가능성이 높은 포맷이에요.</p>
      <div class="ov-grid">${is.overseas.map(o=>`<div class="ov"><small>${o.r}</small><b>${o.t}</b><p>${o.d}</p></div>`).join('')}</div>
    </section>

    <nav class="pager" aria-label="호 이동">
      ${prev?`<a href="#/issue/${prev.id}"><span>← 이전 호</span><b>${prev.label}</b></a>`:`<div><span>← 이전 호</span><b>첫 번째 호예요</b></div>`}
      ${next?`<a class="next" href="#/issue/${next.id}"><span>다음 호 →</span><b>${next.label}</b></a>`
            :`<div class="next"><span>다음 호 →</span><b>${is.next.getMonth()+1}월 ${is.next.getDate()}일 ${DAY[is.next.getDay()]}요일에 공개돼요</b></div>`}
    </nav>
  </div>
  ${footer()}
  </div>`;

  const setOpen=(card,open)=>{
    card.classList.toggle('open',open);
    const b=card.querySelector('.toggle');
    b.setAttribute('aria-expanded',open);
    b.querySelector('span').textContent=open?'기획 아이디어 접기':'기획 아이디어와 레퍼런스 보기';
  };
  document.querySelectorAll('.card').forEach(c=>c.querySelector('.toggle').addEventListener('click',()=>setOpen(c,!c.classList.contains('open'))));
  document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{
    const txt=is.trends[b.dataset.copy].hook;
    try{await navigator.clipboard.writeText(txt)}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
    toast('첫 3초 훅을 복사했어요');
  }));
  document.querySelectorAll('[data-f]').forEach(b=>{ if(b.tagName!=='BUTTON')return;
    b.addEventListener('click',()=>{
      document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      const k=b.dataset.f; let n=0;
      document.querySelectorAll('.card').forEach(c=>{const ok=k==='all'||c.dataset.f.split(' ').includes(k);c.hidden=!ok;if(ok)n++});
      document.getElementById('noTrend').hidden=n>0;
    });
  });

  const first=document.querySelector('.card');
  const target=openIdx?document.getElementById('t'+openIdx):first;
  if(target){setOpen(target,true)}
  if(openIdx&&target){
    requestAnimationFrame(()=>{target.scrollIntoView({behavior:'smooth',block:'start'});target.classList.add('flash');setTimeout(()=>target.classList.remove('flash'),1400)});
  }else window.scrollTo(0,0);
}

function footer(){
  return `<footer><div class="wrap">
    <b>위클립</b>
    <p>매주 월요일, 이번 주 숏폼 트렌드와 기획 아이디어를 전해드려요.</p>
    <p>현재 사이트의 트렌드와 수치는 화면 구성을 보여주기 위한 예시 데이터이며, 레퍼런스 게시물 링크는 아직 연결되지 않았어요.</p>
    <div class="links"><span>이용약관</span><span>개인정보처리방침</span><span>문의하기</span><span>© 2026 Weeklip</span></div>
  </div></footer>`;
}

/* ============ router ============ */
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const [a,b,c]=h.split('/');
  if(a==='issue'){setNav(b===latest().id?'latest':'archive');renderIssue(b,c?Number(c):null);return}
  if(a==='latest'){location.replace('#/issue/'+latest().id);return}
  const onHome=!!document.getElementById('archive');
  if(!onHome)renderHome();
  setNav(['archive','custom'].includes(a)?a:'');
  if(['archive','custom'].includes(a)){
    requestAnimationFrame(()=>{const el=document.getElementById(a);if(el)window.scrollTo({top:el.offsetTop-72,behavior:onHome?'smooth':'auto'})});
  }else if(!onHome)window.scrollTo(0,0);
  else if(!a)window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
